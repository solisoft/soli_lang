# Pocket Garden as a macOS disk image: `Pocket Garden.app` in a .dmg.
#
# examples/pocket-garden is an `eui_window` script. `soli build` turns it into
# one executable that embeds the soli that built it, so the soli here is built
# with `eui-desktop` — the published binaries leave the window out. Built on an
# Apple Silicon runner, because `--target` fetches a prebuilt runtime that has
# no window either.
#
# The artifact is ad-hoc signed, not notarized: on first launch macOS asks to
# confirm (Control-click → Open). See examples/pocket-garden/README.md.
name: pocket garden (macOS dmg)

on:
  workflow_dispatch:
  push:
    branches: [pocket-garden-dmg]
    paths:
      - 'examples/pocket-garden/**'
      - '.github/workflows/pocket-garden-macos.yml'

jobs:
  dmg:
    name: build the disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: pocket-garden-eui-desktop

      - name: soli, with the window
        run: cargo build --release --locked --features eui-desktop

      # Building on a Mac ad-hoc signs the executable; `codesign` below keeps
      # the program `soli build` appended (it rides in __LINKEDIT).
      - name: The game as one executable
        run: |
          set -euo pipefail
          mkdir -p build
          ./target/release/soli build examples/pocket-garden/garden.sl -o build/PocketGarden
          ls -la build/PocketGarden

      - name: Pocket Garden.app
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          app="build/dmg/Pocket Garden.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/PocketGarden "$app/Contents/MacOS/PocketGarden"

          iconset=build/PocketGarden.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size examples/pocket-garden/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) examples/pocket-garden/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/PocketGarden.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pocket Garden</string>
            <key>CFBundleDisplayName</key><string>Pocket Garden</string>
            <key>CFBundleIdentifier</key><string>net.solisoft.pocket-garden</string>
            <key>CFBundleExecutable</key><string>PocketGarden</string>
            <key>CFBundleIconFile</key><string>PocketGarden</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          codesign --force -s - "$app"
          codesign --verify --verbose "$app"

      - name: The disk image
        run: |
          set -euo pipefail
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Pocket Garden" -srcfolder build/dmg -ov -format UDZO build/PocketGarden.dmg
          hdiutil imageinfo build/PocketGarden.dmg | grep -E "Format:|Total Bytes" || true
          shasum -a 256 build/PocketGarden.dmg

      # The app starts, serves its session and answers on loopback. A runner
      # has a display server but no one to look at it, so the check runs the
      # executable with the window turned off and asks for the session.
      - name: The executable serves the game
        run: |
          set -euo pipefail
          SOLI_EUI_NO_WINDOW=1 "build/dmg/Pocket Garden.app/Contents/MacOS/PocketGarden" > serve.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do grep -q '^ws://' serve.log && break; sleep 0.5; done
          kill $pid 2>/dev/null || true
          cat serve.log
          grep -q '^ws://127.0.0.1:[0-9]*/_eui/session/pocket-garden$' serve.log

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGarden-macos-arm64
          path: build/PocketGarden.dmg
          if-no-files-found: error
