name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The SQL adapters are only really tested when a server is there to answer.
  # Their test helpers skip when one is not, and a skipping test still reports
  # `ok` (cargo swallows the message for a passing test), so a run without these
  # services looked exactly like a run that exercised Postgres and MySQL.
  # `SOLI_REQUIRE_DB=1` closes that hole: any adapter test that would skip fails
  # instead, so a broken or missing service breaks the build rather than quietly
  # halving the suite. SQLite needs nothing — its client is bundled.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soli
          POSTGRES_PASSWORD: soli
          POSTGRES_DB: soli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soli -d soli_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: soli
          MYSQL_DATABASE: soli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psoli --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      PG_DATABASE_URL: postgres://soli:soli@localhost:5432/soli_test
      MYSQL_URL: mysql://root:soli@127.0.0.1:3306/soli_test
      SOLI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ github.sha }}

      # The Postgres image ships with TLS off, so without this the adapter's
      # TLS path would only ever be exercised in its "server refuses TLS" arm.
      # A throwaway self-signed cert (generated on the runner, which is
      # guaranteed to have openssl) and a config reload — `ssl` is a SIGHUP
      # parameter — let the suite assert that `sslmode=require` really does
      # produce an encrypted session. The MySQL image has TLS on already.
      - name: Turn on TLS in the Postgres service
        run: |
          set -euo pipefail
          cid=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.crt
          docker cp server.key "$cid":/var/lib/postgresql/server.key
          docker cp server.crt "$cid":/var/lib/postgresql/server.crt
          docker exec -u root "$cid" chown postgres:postgres \
            /var/lib/postgresql/server.key /var/lib/postgresql/server.crt
          docker exec -u root "$cid" chmod 600 /var/lib/postgresql/server.key
          docker exec "$cid" psql -U soli -d soli_test -q \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "SELECT pg_reload_conf()"
          rm -f server.key server.crt
          test "$(docker exec "$cid" psql -U soli -d soli_test -tAc 'show ssl')" = on

      - name: Run tests
        run: cargo test --locked

      - name: Run Soli tests
        run: cargo run --locked -- test

  # Keeps the Windows port from silently re-breaking. The crate has no
  # structural pressure to stay portable, so without a gate the next
  # unconditional `nix` import or `/`-joined path lands unnoticed and is far
  # more expensive to find later. Checks only — running the tests needs a
  # Windows runner, which the release matrix already provides.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked --all-targets

      # Runs the unit tests, which is where the Windows-specific code lives:
      # LockFileEx single-instance locking, job objects, and owner-only
      # directory creation. Those were written and compile-verified from Linux
      # and have never executed — this is the only place they can.
      #
      # Scoped to --lib deliberately. The integration suites shell out, assume
      # POSIX paths and spawn a database; making them portable is its own piece
      # of work, and a red job nobody can act on is worse than a narrow green
      # one that actually gates something.
      - name: Unit tests
        run: cargo test --locked --lib

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ github.sha }}

      - name: Clippy
        # `--all-targets` so the test code is linted too: without it the unit
        # tests and integration suites — the majority of the tree by file count —
        # are never seen by clippy, and lints there rot indefinitely. `--all-features`
        # because `llm`, `embedding` and `codegraph` are default-on, and a
        # `--no-default-features` build path exists for lean standalone runtimes
        # that should not be the only thing to discover a broken cfg.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Unwrap-count ratchet (parser/template/JSON)
        # Freezes `.unwrap()`/`.expect()` counts in modules that process
        # untrusted input. Every one of them is a potential panic the fuzzing
        # workflow will eventually reach; this gate keeps the number from
        # growing while fixes land. See scripts/lint_unwraps.sh.
        run: scripts/lint_unwraps.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # A published advisory against a transitive dependency is the one class of
  # vulnerability no amount of reviewing *our* code will surface: nothing in
  # the diff changes, and the suite stays green. Soli pulls in a TLS stack, an
  # image decoder, tar/flate2, and several parsers that all sit directly on
  # untrusted input, so this runs on every push rather than on a schedule.
  #
  # `--deny warnings` also fails on unmaintained/unsound advisories, not just
  # ones with a CVE. When a finding has no fix available yet, ignore that
  # specific advisory id here with a comment saying why and when to revisit —
  # never by dropping the flag.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # RUSTSEC-2026-0253 (lru, unsound `LruCache::pop()` under a panicking
      # Drop) — patched in lru >= 0.18.2, which is what our own `lru = "0.18"`
      # already resolves to. The two flagged copies are pinned by transitive
      # parents we don't control: ratatui 0.26 holds lru 0.12, and
      # azul-layout / mysql 28 hold lru 0.16. Nothing here can move them.
      # Drop this ignore once those parents release against 0.18.2 — re-check
      # by removing the flag and reading which crate is still named.
      - name: Audit dependencies
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0253

  # The two engines must agree, `soli check` must not reject working code, and
  # hostile input must not reach a Rust panic. Each is a separate failure mode
  # that the unit tests structurally cannot see:
  #
  #   * A divergence needs both engines run over the same program. `soli test`
  #     runs only the tree-walking interpreter and `soli serve` runs only the VM,
  #     so a disagreement between them passes the suite and fails in production —
  #     which is exactly how a function stored in a hash, `inspect` on nested
  #     strings, `hash.to_s()` and `[].pop()` all came to differ.
  #   * A too-narrow declared arity makes a working call fail `soli check`. Both
  #     engines agree perfectly and the method is still unreachable.
  #   * A panic is not how bad input should be reported, even now that release
  #     builds unwind and a per-request guard turns it into a 500.
  #
  # Cheap enough to run on every push: three scripts over one release binary.
  engine-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary the sweeps run against
        run: cargo build --release --locked

      - name: Engines agree
        run: ./bench/engine-parity/sweep.sh < bench/engine-parity/expressions.txt

      - name: soli check does not reject working calls
        run: ./bench/engine-parity/checkscan.sh < bench/engine-parity/arity-probes.txt

      - name: Hostile input does not panic
        run: ./bench/engine-parity/panicscan.sh < bench/engine-parity/hostile-inputs.txt

      # Nothing ran `examples/` until this existed, so three of them had been
      # failing to lex since they were written — a reader opening one got an
      # error instead of an example. Parsing only: an example may legitimately
      # need a database or a running server.
      - name: Shipped examples parse
        run: ./scripts/check-examples.sh

  # Drives Soli's own frontend in a real headless browser: instant-nav, the
  # LiveView client, and the dev bar. None of it was covered before — jsdom
  # cannot open a websocket or lay anything out, so a morph, an event dispatch
  # or a head merge could break silently.
  #
  # A standalone job rather than a step on `test`: it needs a browser nobody
  # else needs, and running in parallel keeps it off the critical path.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # The runner image happens to ship Chrome, but relying on that makes the
      # job depend on an image detail that can change without notice.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ github.sha }}

      - name: Build
        run: cargo build --locked

      # The driver itself, against a browser but no server.
      - name: Test the browser driver
        run: cargo test --locked --test browser_driver_test

      # The framework's frontend, against a real Soli server.
      - name: Run browser specs
        run: cargo run --locked -- test tests-e2e/browser/specs --browser --no-coverage

  # Validate that the tagged + PDF/A output is genuinely conformant, using the
  # veraPDF reference validator. Guards the "accessible + archival" claim: the
  # sample must pass BOTH PDF/A-3b and PDF/UA-1 (veraPDF exits non-zero on a
  # non-compliant file, failing the job).
  verapdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java (for veraPDF)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install veraPDF
        run: |
          curl -fsSL -o /tmp/vera.zip https://software.verapdf.org/rel/verapdf-installer.zip
          (cd /tmp && unzip -q vera.zip)
          JAR=$(ls /tmp/verapdf-greenfield-*/verapdf-izpack-installer-*.jar | head -1)
          java -jar "$JAR" scripts/verapdf-auto-install.xml

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ github.sha }}

      - name: Generate sample PDFs
        run: cargo run --locked -- scripts/verapdf_samples.sl

      - name: Validate PDF/A-3b
        run: /tmp/verapdf/verapdf --flavour 3b /tmp/vp_tagged_pdfa.pdf

      - name: Validate PDF/UA-1
        run: /tmp/verapdf/verapdf --flavour ua1 /tmp/vp_tagged_pdfa.pdf

  release:
    # Tag releases wait for the full gate, not just test/clippy/fmt.
    # windows-check, audit, engine-parity, browser, and verapdf each
    # cover a failure mode the Linux suite cannot see; a red job here
    # must stop the draft release and the binary/docker publish.
    needs: [test, clippy, fmt, windows-check, audit, engine-parity, browser, verapdf]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --draft --generate-notes

  build-binaries:
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: soli-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: soli-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: soli-darwin-arm64
          # Intel Mac. `soli update` has always resolved x86_64 macOS hosts to
          # this artifact name, so without it those users get a 404.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: soli-darwin-amd64
          # Keep the .tar.gz + .sha256 convention on Windows too: the standalone
          # builder downloads and verifies that shape, and a .zip would mean a
          # second code path plus a zip dependency for cosmetics. Windows 10
          # 1803+ ships bsdtar as tar.exe, so the packaging step is unchanged
          # apart from the binary name.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: soli-windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Only the cross linker/compiler is needed. OpenSSL is vendored
          # (compiled from source — see `ssh2` in Cargo.toml), so we no longer
          # install `libssl-dev:arm64` from the arm64 multiarch mirror
          # (ports.ubuntu.com), which is unreachable from some CI runners.
          # perl + make (for building vendored OpenSSL) are preinstalled.
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package binary
        # `shell: bash` is explicit because windows-latest defaults to
        # PowerShell, where this script would not run. Windows 10 1803+ ships
        # bsdtar as tar.exe, so the tar invocation itself is unchanged.
        shell: bash
        run: |
          # Windows produces soli.exe; every other target produces soli. The
          # standalone builder looks for the matching name inside the tarball.
          BIN=soli
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=soli.exe; fi
          ls -la target/${{ matrix.target }}/release/$BIN
          tar -czf ${{ matrix.artifact }}.tar.gz -C target/${{ matrix.target }}/release $BIN
          # SEC-041: publish a `.sha256` sibling so `soli update` can
          # verify the downloaded tarball before extracting / chmod-ing.
          # No single checksum tool spans the matrix: macOS ships `shasum` but
          # not coreutils' `sha256sum`, while the Windows runner's Git Bash
          # ships `sha256sum` but not `shasum`. Linux has both. Picking at
          # runtime keeps one step for all five targets.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }}.tar.gz | awk '{print $1}' > ${{ matrix.artifact }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.tar.gz | awk '{print $1}' > ${{ matrix.artifact }}.tar.gz.sha256
          fi
          cat ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload --clobber ${{ github.ref_name }} ${{ matrix.artifact }}.tar.gz
          gh release upload --clobber ${{ github.ref_name }} ${{ matrix.artifact }}.tar.gz.sha256

  publish-release:
    needs: [build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false

  docker:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
