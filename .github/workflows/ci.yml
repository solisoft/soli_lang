name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read-only by default: the checks run third-party actions and whatever the
# pull request changed, and none of them needs to write to the repository.
# The jobs that publish (draft-release, the builds, publish-release, docker)
# ask for what they use.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The SQL adapters are only really tested when a server is there to answer.
  # Their test helpers skip when one is not, and a skipping test still reports
  # `ok` (cargo swallows the message for a passing test), so a run without these
  # services looked exactly like a run that exercised Postgres and MySQL.
  # `SOLI_REQUIRE_DB=1` closes that hole: any adapter test that would skip fails
  # instead, so a broken or missing service breaks the build rather than quietly
  # halving the suite. SQLite needs nothing — its client is bundled.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soli
          POSTGRES_PASSWORD: soli
          POSTGRES_DB: soli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soli -d soli_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: soli
          MYSQL_DATABASE: soli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psoli --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      PG_DATABASE_URL: postgres://soli:soli@localhost:5432/soli_test
      MYSQL_URL: mysql://root:soli@127.0.0.1:3306/soli_test
      SOLI_REQUIRE_DB: "1"
      SOLIKV_RESP_HOST: 127.0.0.1
      SOLIKV_RESP_PORT: "6380"
      SOLIDB_DRIVER_TEST_HOST: 127.0.0.1:16745

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Swatinem/rust-cache, not actions/cache/restore. The restore-only step
      # this replaces was keyed on ${{ github.sha }} with no restore-keys, and
      # nothing in the repository ever ran actions/cache/save — so the key was
      # never written and the restore missed on every single run. `gh cache
      # list` confirmed it: zero Linux-cargo-<sha> entries had ever existed.
      # This job and the three below it were compiling from scratch every time.
      #
      # save-if keeps writes to main: rust-cache saves whenever its key changes,
      # and this repository was already at 12.2 GB against GitHub's 10 GB limit,
      # so PR branches each pushing an entry is how caches start evicting each
      # other.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Postgres image ships with TLS off, so without this the adapter's
      # TLS path would only ever be exercised in its "server refuses TLS" arm.
      # A throwaway self-signed cert (generated on the runner, which is
      # guaranteed to have openssl) and a config reload — `ssl` is a SIGHUP
      # parameter — let the suite assert that `sslmode=require` really does
      # produce an encrypted session. The MySQL image has TLS on already.
      - name: Turn on TLS in the Postgres service
        run: |
          set -euo pipefail
          cid=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.crt
          docker cp server.key "$cid":/var/lib/postgresql/server.key
          docker cp server.crt "$cid":/var/lib/postgresql/server.crt
          docker exec -u root "$cid" chown postgres:postgres \
            /var/lib/postgresql/server.key /var/lib/postgresql/server.crt
          docker exec -u root "$cid" chmod 600 /var/lib/postgresql/server.key
          docker exec "$cid" psql -U soli -d soli_test -q \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "SELECT pg_reload_conf()"
          rm -f server.key server.crt
          test "$(docker exec "$cid" psql -U soli -d soli_test -tAc 'show ssl')" = on

      # SoliDB for tests/solidb_driver_test.rs, which checks the native driver
      # (`solidb-driver`, on by default) end to end: rows decoded straight into
      # Soli values must equal the JSON path's — and for the `.sl` specs below.
      # The current release, not an old pin: the specs assert the server's
      # answers (an aggregate over an empty match, a duplicate `_key`), and
      # 1.1.0 answered both differently from the 2.x every app runs on.
      # Not a service container: the
      # published image (ghcr.io/solisoft/solidb:v1.1.0) puts a binary built
      # for glibc 2.39 on a bookworm base (2.36) and exits on start. The
      # release binary runs on the runner itself (ubuntu-latest, glibc 2.39).
      # Port 16745, not 6745 or the spec runner's 6799, so nothing that probes
      # those ports starts talking to it. `--host` is explicit because SoliDB
      # reads a `.env` from any parent directory, and a `SOLIDB_HOST` URL meant
      # for its clients would become its listen address.
      - name: Start SoliDB (native driver test and specs)
        run: |
          curl -fsSL -o /tmp/solidb.tgz https://github.com/solisoft/solidb/releases/download/v2.14.0/solidb-linux-amd64.tar.gz
          mkdir -p /tmp/solidb && tar -xzf /tmp/solidb.tgz -C /tmp/solidb
          SOLIDB_ADMIN_PASSWORD=admin JWT_SECRET=ci-only-jwt-secret-for-the-test-server \
            nohup /tmp/solidb/solidb --host 127.0.0.1 --port 16745 --data-dir /tmp/solidb/data > /tmp/solidb/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:16745/_api/health && exit 0
            sleep 1
          done
          cat /tmp/solidb/server.log
          exit 1

      # SoliKV for the KV and Cache specs: the real server, not a stand-in.
      # Redis backed them until a SoliKV binary was published, and the
      # stand-in hid exactly what its own caveat warned about — SoliKV 0.4.3
      # answers SINTER/SUNION/SDIFF/SMOVE differently and lacks RPOPLPUSH and
      # SMISMEMBER, which Redis passed; it also has no TOUCH, loses the value on
      # RENAME and drops a key's TTL on APPEND. Those specs are `pending` with the
      # reason, so the day SoliKV catches up they say so. On 6380, the
      # client's default, which the job env already names.
      - name: Start SoliKV (KV and Cache specs)
        run: |
          curl -fsSL -o /tmp/solikv.tgz https://github.com/solisoft/kv/releases/download/v0.4.3/solikv-linux-amd64.tar.gz
          mkdir -p /tmp/solikv && tar -xzf /tmp/solikv.tgz -C /tmp/solikv
          nohup "$(find /tmp/solikv -type f -name solikv | head -1)" --bind 127.0.0.1 --port 6380 \
            --rest-port 15021 --appendonly false --dir /tmp/solikv > /tmp/solikv/server.log 2>&1 &
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/6380) 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/solikv/server.log
          exit 1

      - name: Run tests
        run: cargo test --locked

      # `pdf/` is its own cargo workspace, not a member of the root manifest,
      # so `cargo test` above compiles soli-pdf as a dependency and never runs
      # a single one of its own tests. That left the whole PDF engine — the
      # layout passes, Factur-X, signatures, the raster backend — covered only
      # by the handful of `.sl` specs that call the builtins end to end.
      - name: Run PDF engine tests
        run: cargo test --locked --manifest-path pdf/Cargo.toml

      # `yaml/` (soli-yaml, the parser behind `Yaml.parse` and the locale
      # files) is its own workspace too; its tests hold what serde_yaml read
      # and wrote, so a change that drifts from it fails here.
      - name: Run YAML parser tests
        run: cargo test --locked --manifest-path yaml/Cargo.toml

      # The specs run against the SoliDB started above (16745) and SoliKV. A
      # spec that needs one calls `requires_solidb()` / `requires_solikv()` in
      # a `before_each`, which skips when the service does not answer — and
      # the job's SOLI_REQUIRE_DB=1 turns that skip into a failure, so a
      # broken service cannot make the suite pass by testing nothing. Until
      # this step named a SoliDB, every DB spec probed localhost:6745, found
      # nothing and returned early, and the suites guarded by
      # `if __db_available` were never even registered.
      - name: Run Soli tests
        env:
          SOLI_TEST_SOLIDB_HOST: http://127.0.0.1:16745
          SOLIDB_USERNAME: admin
          SOLIDB_PASSWORD: admin
          # The KV admin commands (FLUSHDB, KEYS, …) are refused unless this is
          # set; the SoliKV started above is disposable, so let the specs
          # exercise them rather than skip.
          SOLI_KV_ALLOW_ADMIN: "1"
        # --require-assertions: a spec that passes without asserting anything
        # fails. Every spec in tests/ asserts; keep it that way.
        run: cargo run --locked -- test --require-assertions

      # The docs site's specs (www/tests): its controller, middleware, routes,
      # validation helpers and the search index (every routed docs page must
      # be indexed). They need no database — www/.env.test names one only
      # because the runner requires the file.
      - name: Run the docs site's specs
        working-directory: www
        run: cargo run --locked --manifest-path ../Cargo.toml -- test --require-assertions --no-coverage

  # Keeps the Windows port from silently re-breaking. The crate has no
  # structural pressure to stay portable, so without a gate the next
  # unconditional `nix` import or `/`-joined path lands unnoticed and is far
  # more expensive to find later. Checks only — running the tests needs a
  # Windows runner, which the release matrix already provides.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # This job had no cache at all, and at 15.2 min it is the critical path —
      # every other job finishes inside it, so its cold rebuild set the length
      # of the whole run.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --locked --all-targets

      # Runs the unit tests, which is where the Windows-specific code lives:
      # LockFileEx single-instance locking, job objects, and owner-only
      # directory creation. Those were written and compile-verified from Linux
      # and have never executed — this is the only place they can.
      #
      # Scoped to --lib deliberately. The integration suites shell out, assume
      # POSIX paths and spawn a database; making them portable is its own piece
      # of work, and a red job nobody can act on is worse than a narrow green
      # one that actually gates something.
      - name: Unit tests
        run: cargo test --locked --lib

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # libasound2-dev is here and not on the other jobs because this is the
      # only one that passes --all-features, which turns on `eui-desktop` and so
      # pulls eui-client -> cpal -> alsa -> alsa-sys, whose build script asks
      # pkg-config for ALSA and fails the whole lint without it. The rest of the
      # desktop stack needs nothing: winit resolves wayland through
      # `wayland-dlopen`, so libwayland is opened at runtime, not linked here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      # rust-cache, for the reasons spelled out on the `test` job above.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        # `--all-targets` so the test code is linted too: without it the unit
        # tests and integration suites — the majority of the tree by file count —
        # are never seen by clippy, and lints there rot indefinitely. `--all-features`
        # because `llm`, `embedding` and `codegraph` are default-on, and a
        # `--no-default-features` build path exists for lean standalone runtimes
        # that should not be the only thing to discover a broken cfg.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The `pdf/` workspace is invisible to the command above for the same
      # reason its tests are: clippy does not lint dependencies. Warnings are
      # not denied here yet — the crate has a backlog of pre-existing lints —
      # so this reports without gating until that is cleared.
      - name: Clippy (PDF engine)
        run: cargo clippy --locked --manifest-path pdf/Cargo.toml --all-targets
        continue-on-error: true

      - name: Clippy (YAML parser)
        run: cargo clippy --locked --manifest-path yaml/Cargo.toml --all-targets -- -D warnings

      - name: Unwrap-count ratchet (parser/template/JSON)
        # Freezes `.unwrap()`/`.expect()` counts in modules that process
        # untrusted input. Every one of them is a potential panic the fuzzing
        # workflow will eventually reach; this gate keeps the number from
        # growing while fixes land. See scripts/lint_unwraps.sh.
        run: scripts/lint_unwraps.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check formatting (PDF engine)
        run: cargo fmt --check --manifest-path pdf/Cargo.toml

      - name: Check formatting (YAML parser)
        run: cargo fmt --check --manifest-path yaml/Cargo.toml

      - name: Check formatting (edge runtime)
        run: cargo fmt --check --manifest-path edge/Cargo.toml

  # The edge (Cloudflare Workers) build compiles the library for wasm32, where
  # sockets, threads and the disk do not exist. Native code that reaches for one
  # outside a `cfg(not(target_arch = "wasm32"))` breaks it — and nothing else in
  # this workflow builds for wasm32, so it would surface at the next deploy.
  # A check, not a build: the size-optimised release link takes minutes and
  # proves nothing more about the code. See www/docs/edge.md.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: edge
          workspaces: edge -> ../target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check (wasm32)
        # getrandom 0.3 picks its JS backend from a cfg, not a feature.
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          --manifest-path edge/Cargo.toml --target-dir target

      # The runtime `scripts/build-edge.sh --pdf` builds: the PDF crate and
      # its dependencies compile for wasm32 only behind this feature.
      - name: Check (wasm32, with PDF)
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          --manifest-path edge/Cargo.toml --target-dir target --features pdf

  # A published advisory against a transitive dependency is the one class of
  # vulnerability no amount of reviewing *our* code will surface: nothing in
  # the diff changes, and the suite stays green. Soli pulls in a TLS stack, an
  # image decoder, tar/flate2, and several parsers that all sit directly on
  # untrusted input, so this runs on every push rather than on a schedule.
  #
  # `--deny warnings` also fails on unmaintained/unsound advisories, not just
  # ones with a CVE. When a finding has no fix available yet, ignore that
  # specific advisory id here with a comment saying why and when to revisit —
  # never by dropping the flag.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: audit
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Every waiver lives in .cargo/audit.toml, with the reason and the
      # condition that removes it. Keep them there rather than as flags here:
      # cargo-audit reads that file, so `cargo audit` locally gives the same
      # verdict this job does. A waiver passed only on this command line makes
      # a developer's local run fail on something CI has already accepted.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  # The two engines must agree, `soli check` must not reject working code, and
  # hostile input must not reach a Rust panic. Each is a separate failure mode
  # that the unit tests structurally cannot see:
  #
  #   * A divergence needs both engines run over the same program. `soli test`
  #     runs only the tree-walking interpreter and `soli serve` runs only the VM,
  #     so a disagreement between them passes the suite and fails in production —
  #     which is exactly how a function stored in a hash, `inspect` on nested
  #     strings, `hash.to_s()` and `[].pop()` all came to differ.
  #   * A too-narrow declared arity makes a working call fail `soli check`. Both
  #     engines agree perfectly and the method is still unreachable.
  #   * A panic is not how bad input should be reported, even now that release
  #     builds unwind and a per-request guard turns it into a 500.
  #
  # Cheap enough to run on every push: three scripts over one release binary.
  engine-parity:
    runs-on: ubuntu-latest

    # Every script here defaults to ./target/release/soli and honours SOLI, so
    # pointing them at the `ci` profile is the whole change on this side. See
    # the profile's comment in Cargo.toml for why it is not `release`.
    env:
      SOLI: ./target/ci/soli

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: engine-parity
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the binary the sweeps run against
        run: cargo build --profile ci --locked

      - name: Engines agree
        run: ./bench/engine-parity/sweep.sh < bench/engine-parity/expressions.txt

      - name: soli check does not reject working calls
        run: ./bench/engine-parity/checkscan.sh < bench/engine-parity/arity-probes.txt

      - name: Hostile input does not panic
        run: ./bench/engine-parity/panicscan.sh < bench/engine-parity/hostile-inputs.txt

      # Nothing ran `examples/` until this existed, so three of them had been
      # failing to lex since they were written — a reader opening one got an
      # error instead of an example. Parsing only: an example may legitimately
      # need a database or a running server.
      - name: Shipped examples parse
        run: ./scripts/check-examples.sh

  # Drives Soli's own frontend in a real headless browser: instant-nav, the
  # LiveView client, and the dev bar. None of it was covered before — jsdom
  # cannot open a websocket or lay anything out, so a morph, an event dispatch
  # or a head merge could break silently.
  #
  # A standalone job rather than a step on `test`: it needs a browser nobody
  # else needs, and running in parallel keeps it off the critical path.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # The runner image happens to ship Chrome, but relying on that makes the
      # job depend on an image detail that can change without notice.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # rust-cache, for the reasons spelled out on the `test` job above.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: browser
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked

      # The driver itself, against a browser but no server.
      - name: Test the browser driver
        run: cargo test --locked --test browser_driver_test

      # The framework's frontend, against a real Soli server.
      # Two invocations on purpose. Test servers run in production mode so
      # specs exercise the bytecode VM that serves production; the dev bar
      # only exists under `--dev`, so its spec gets a dev server of its own
      # and the rest keep their VM coverage.
      - name: Run browser specs
        run: cargo run --locked -- test tests-e2e/browser/specs --browser --no-coverage

      - name: Run dev-mode browser specs
        env:
          SOLI_TEST_SERVER_DEV: "1"
        run: cargo run --locked -- test tests-e2e/browser/dev-specs --browser --no-coverage

  # Validate that the tagged + PDF/A output is genuinely conformant, using the
  # veraPDF reference validator. Guards the "accessible + archival" claim: the
  # sample must pass BOTH PDF/A-3b and PDF/UA-1 (veraPDF exits non-zero on a
  # non-compliant file, failing the job).
  verapdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Set up Java (for veraPDF)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install veraPDF
        run: |
          curl -fsSL -o /tmp/vera.zip https://software.verapdf.org/rel/verapdf-installer.zip
          (cd /tmp && unzip -q vera.zip)
          JAR=$(ls /tmp/verapdf-greenfield-*/verapdf-izpack-installer-*.jar | head -1)
          java -jar "$JAR" scripts/verapdf-auto-install.xml

      # rust-cache, for the reasons spelled out on the `test` job above.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: verapdf
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate sample PDFs
        run: cargo run --locked -- scripts/verapdf_samples.sl

      - name: Validate PDF/A-3b
        run: /tmp/verapdf/verapdf --flavour 3b /tmp/vp_tagged_pdfa.pdf

      - name: Validate PDF/UA-1
        run: /tmp/verapdf/verapdf --flavour ua1 /tmp/vp_tagged_pdfa.pdf

  # The tag pipeline runs the builds in parallel with the checks instead of
  # after them: the draft release is created at once, every binary compiles
  # while test/clippy/… run, and `release` — the gate — is what
  # `publish-release` waits for. A red check still stops the publish and the
  # Docker image; it only leaves an unpublished draft holding the binaries
  # (delete it before re-tagging). Before, the builds waited ~13 minutes for
  # the gate and a tag took ~70 minutes to reach Docker.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run of a failed tag finds its draft already there.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --generate-notes

  release:
    # The gate. Tag releases wait for the full set, not just test/clippy/fmt:
    # audit, engine-parity, browser, and verapdf each cover a failure mode the
    # Linux suite cannot see; a red job here must stop the publish and the
    # Docker image. windows-check is not in this list: Windows gates only the
    # Windows binary (build-windows), never the Linux and macOS release.
    needs: [draft-release, test, clippy, fmt, audit, engine-parity, browser, verapdf]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Every check passed for $GITHUB_REF_NAME"

  build-binaries:
    needs: draft-release
    name: build ${{ matrix.kind }} ${{ matrix.platform.name }}
    strategy:
      matrix:
        # soli and render_pdf are separate jobs, so neither waits for the
        # other's compile.
        kind: [soli, render_pdf]
        platform:
          # Linux binaries are built on Ubuntu 24.04, not `ubuntu-latest`: a
          # binary links against the build host's glibc, and `ubuntu-latest`
          # moved to 26.04 (glibc 2.43), so 2.36.1–2.36.3 refused to start on
          # 24.04 hosts ("GLIBC_2.43 not found"). The oldest supported LTS
          # sets the floor; raise it deliberately, never by a runner update.
          #
          # `profile` is soli's. Linux — where Soli runs in production, and
          # what the Docker image ships — gets `dist` (fat LTO, one codegen
          # unit: a few percent faster, ~14 min). macOS gets `release`
          # (ThinLTO, 16 units): the fat-LTO build took 26–30 min there and
          # was the pipeline's critical path, for a development machine.
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            profile: dist
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            profile: dist
          - name: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            profile: release
          # Intel Mac. `soli update` has always resolved x86_64 macOS hosts to
          # this artifact name, so without it those users get a 404.
          - name: darwin-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            profile: release
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    env:
      # soli-linux-amd64, render-pdf-darwin-arm64, …
      ARTIFACT: ${{ matrix.kind == 'soli' && 'soli' || 'render-pdf' }}-${{ matrix.platform.name }}
    # Shared with build-windows through the anchor.
    steps: &build-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install system dependencies (Linux x86_64)
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Only the cross linker/compiler is needed; perl + make are
          # preinstalled. No `libssl-dev:arm64` from the arm64 multiarch mirror
          # (ports.ubuntu.com), which is unreachable from some CI runners.
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build soli
        if: matrix.kind == 'soli'
        run: cargo build --profile ${{ matrix.platform.profile }} --locked --target ${{ matrix.platform.target }}
        env:
          # The key `soli update` checks a release's signature against, built
          # into the binary (a repository *variable*: it is public). Unset,
          # the binary verifies the published digest only.
          SOLI_RELEASE_PUBKEY: ${{ vars.SOLI_RELEASE_PUBKEY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package soli
        if: matrix.kind == 'soli'
        # `shell: bash` is explicit because windows-latest defaults to
        # PowerShell, where this script would not run. Windows 10 1803+ ships
        # bsdtar as tar.exe, so the tar invocation itself is unchanged.
        shell: bash
        run: |
          # Windows produces soli.exe; every other target produces soli. The
          # standalone builder looks for the matching name inside the tarball.
          BIN=soli
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=soli.exe; fi
          OUT=target/${{ matrix.platform.target }}/${{ matrix.platform.profile }}
          ls -la $OUT/$BIN
          tar -czf $ARTIFACT.tar.gz -C $OUT $BIN

      - name: Build render_pdf
        if: matrix.kind == 'render_pdf'
        run: cargo build --release --locked --manifest-path pdf/Cargo.toml --bin render_pdf --target ${{ matrix.platform.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Package render_pdf
        if: matrix.kind == 'render_pdf'
        # The standalone PDF renderer behind the `soli-pdf` Ruby gem. Fonts are
        # loaded at runtime, so the tarball carries pdf/fonts next to the binary.
        shell: bash
        run: |
          BIN=render_pdf
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=render_pdf.exe; fi
          PKG=render-pdf-stage
          mkdir -p $PKG
          cp pdf/target/${{ matrix.platform.target }}/release/$BIN $PKG/
          cp -R pdf/fonts $PKG/fonts
          tar -czf $ARTIFACT.tar.gz -C $PKG .

      - name: Checksum and upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SEC-041: publish a `.sha256` sibling so `soli update` can
          # verify the downloaded tarball before extracting / chmod-ing.
          # No single checksum tool spans the matrix: macOS ships `shasum` but
          # not coreutils' `sha256sum`, while the Windows runner's Git Bash
          # ships `sha256sum` but not `shasum`. Linux has both. Picking at
          # runtime keeps one step for every target.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $ARTIFACT.tar.gz | awk '{print $1}' > $ARTIFACT.tar.gz.sha256
          else
            shasum -a 256 $ARTIFACT.tar.gz | awk '{print $1}' > $ARTIFACT.tar.gz.sha256
          fi
          cat $ARTIFACT.tar.gz.sha256
          gh release upload --clobber ${{ github.ref_name }} $ARTIFACT.tar.gz $ARTIFACT.tar.gz.sha256

  # The digest sits beside the tarball: whoever can replace one can replace
  # the other. The signature is made with a key that is not on the release —
  # `soli update`, the version pin and install.sh check it against the public
  # half (built into the binary, written into the script).
  #
  # A job of its own, with no checkout and no build: the key is never on a
  # runner that has just run cargo and every dependency's build script. It
  # downloads what the build jobs uploaded, checks each tarball against its
  # published digest, and signs a statement — the tag, the artifact's name
  # and the digest, one per line (`release_statement` in src/update.rs) — not
  # the tarball alone, whose signature would be good under any tag and name.
  sign-release:
    # After the gate, not only after the builds: a tag whose tests fail gets
    # no signed tarball.
    needs: [build-binaries, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Keep the key an *environment* secret of `release-signing`, with a
    # deployment rule for `v*` tags: a repository secret is readable by any
    # workflow someone with write access pushes.
    environment: release-signing
    permissions:
      contents: write
    env:
      # The Windows tarballs arrive later, from their own job, and are
      # signed by `sign-windows`.
      SIGN_WINDOWS: "no"
    steps: &sign-steps
      - name: Sign the release's tarballs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOLI_RELEASE_SIGNING_KEY: ${{ secrets.SOLI_RELEASE_SIGNING_KEY }}
          SOLI_RELEASE_PUBKEY: ${{ vars.SOLI_RELEASE_PUBKEY }}
        run: |
          # Whitespace anywhere in the variable is dropped, as the binary
          # drops it when it reads the key it was built with.
          pubkey=$(printf '%s' "$SOLI_RELEASE_PUBKEY" | tr -d '[:space:]')
          if [ -z "$SOLI_RELEASE_SIGNING_KEY" ]; then
            # Both halves or neither: a binary that expects a signature this
            # job did not make could never update.
            if [ -n "$pubkey" ]; then
              echo "::error::SOLI_RELEASE_PUBKEY is set but the SOLI_RELEASE_SIGNING_KEY secret is not"
              exit 1
            fi
            echo "No release key yet: nothing to sign."
            exit 0
          fi
          keyfile="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$keyfile"' EXIT
          ( umask 077; printf '%s\n' "$SOLI_RELEASE_SIGNING_KEY" > "$keyfile" )
          # The two halves are one pair: the public key derived from the
          # secret (the last 65 bytes of its SubjectPublicKeyInfo — the SEC1
          # point) is the variable the binaries were built with. A mismatch
          # would publish binaries that refuse every update.
          derived=$(openssl pkey -in "$keyfile" -pubout -outform DER | tail -c 65 | openssl base64 -A)
          if [ "$derived" != "$pubkey" ]; then
            echo "::error::SOLI_RELEASE_PUBKEY is not the public half of SOLI_RELEASE_SIGNING_KEY"
            exit 1
          fi
          openssl pkey -in "$keyfile" -pubout -out "$RUNNER_TEMP/release-key.pub"
          mkdir release && cd release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --pattern '*.tar.gz.sha256' --pattern '*.tar.gz.sig'
          signed=0
          for name in *.tar.gz; do
            # Only what this pipeline builds, and only this job's share.
            case "$name" in
              soli-windows-*|render-pdf-windows-*) [ "$SIGN_WINDOWS" = "yes" ] || continue ;;
              soli-*|render-pdf-*) [ "$SIGN_WINDOWS" = "no" ] || continue ;;
              *) echo "Not one of ours, not signed: $name"; continue ;;
            esac
            if [ ! -s "$name.sha256" ]; then
              echo "::error::$name has no published .sha256"
              exit 1
            fi
            digest=$(sha256sum "$name" | awk '{print $1}')
            if [ "$digest" != "$(cat "$name.sha256")" ]; then
              echo "::error::$name does not match its published .sha256"
              exit 1
            fi
            printf '%s\n%s\n%s\n' "$GITHUB_REF_NAME" "$name" "$digest" > "$RUNNER_TEMP/statement"
            # A signature already there is kept only if it is this key's for
            # this tarball: after a re-run the tarballs are new builds, and
            # the signatures of the old ones are not theirs.
            if [ -s "$name.sig" ] &&
               openssl base64 -d -A < "$name.sig" > "$RUNNER_TEMP/sig.der" 2>/dev/null &&
               openssl dgst -sha256 -verify "$RUNNER_TEMP/release-key.pub" \
                 -signature "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/statement" >/dev/null 2>&1; then
              continue
            fi
            openssl dgst -sha256 -sign "$keyfile" "$RUNNER_TEMP/statement" | openssl base64 -A > "$name.sig"
            test -s "$name.sig"
            gh release upload --clobber "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$name.sig"
            signed=$((signed + 1))
          done
          echo "Signed $signed tarball(s)."

  # Windows on its own: a red windows-check or a failed Windows build costs the
  # Windows binary only. The Linux and macOS release publishes without waiting;
  # this job uploads to the release whenever it finishes (`gh release upload`
  # takes a published release too).
  build-windows:
    needs: [draft-release, windows-check]
    name: build ${{ matrix.kind }} ${{ matrix.platform.name }}
    strategy:
      matrix:
        kind: [soli, render_pdf]
        platform:
          # Keep the .tar.gz + .sha256 convention on Windows too: the standalone
          # builder downloads and verifies that shape, and a .zip would mean a
          # second code path plus a zip dependency for cosmetics. Windows 10
          # 1803+ ships bsdtar as tar.exe, so the packaging step is unchanged
          # apart from the binary name. `release`, not `dist`, for the reason
          # given on macOS above (fat LTO took 30 min here).
          - name: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            profile: release
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    env:
      ARTIFACT: ${{ matrix.kind == 'soli' && 'soli' || 'render-pdf' }}-${{ matrix.platform.name }}
    steps: *build-steps

  # The Windows tarballs, signed when they arrive.
  sign-windows:
    needs: [build-windows, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    env:
      SIGN_WINDOWS: "yes"
    steps: *sign-steps

  publish-release:
    needs: [release, build-binaries, sign-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false

  # The image packs the Linux binaries the release already holds
  # (Dockerfile.release) instead of compiling soli a second time, which took
  # 20 minutes after everything else. It is amd64 and arm64.
  docker:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch the Linux binaries from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            gh release download "$GITHUB_REF_NAME" -D downloads \
              -p "soli-linux-$arch.tar.gz" -p "soli-linux-$arch.tar.gz.sha256"
            echo "$(cat downloads/soli-linux-$arch.tar.gz.sha256)  downloads/soli-linux-$arch.tar.gz" | sha256sum -c -
            mkdir -p release-image/dist/linux-$arch
            tar -xzf downloads/soli-linux-$arch.tar.gz -C release-image/dist/linux-$arch
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing compiles in the image, so a missing library or a glibc too old
      # for the binary would only show when someone runs it. Run it first.
      - name: Build the amd64 image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: release-image
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: soli-release-check

      - name: The image runs and is this release
        run: docker run --rm soli-release-check --version | tee /dev/stderr | grep -F "${GITHUB_REF_NAME#v}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: release-image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
