name: Fuzz

# libFuzzer runs against the lexer/parser, template engine, and JSON
# conversion. Any panic (including stack overflow) in these surfaces is a
# bug: they process untrusted input in every deployment. Crash artifacts are
# uploaded for triage; the minimizing repro lands in fuzz/artifacts.

on:
  # Nightly: give each target a real time budget.
  schedule:
    - cron: "0 3 * * *"
  # Fast smoke (20s/target) when the fuzzed surfaces change.
  pull_request:
    paths:
      - "src/lexer/**"
      - "src/parser/**"
      - "src/template/**"
      - "src/interpreter/value_json.rs"
      - "src/interpreter/value_stringify.rs"
      # Owns the hand-rolled JSON parser `json_parse` uses; it was missing
      # here, so a change to that parser never triggered the smoke run.
      - "src/interpreter/value.rs"
      - "fuzz/**"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_program
          - template_parse_render
          - json_roundtrip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-

      # The corpus is what makes a 10-minute budget worth anything: without it
      # every run rediscovers basic syntax before it can reach a real bug. It is
      # deliberately NOT in git (one session produced 16 MB, which git would keep
      # forever), so it is carried here instead. `run_id` in the key makes every
      # run save a fresh entry; `restore-keys` picks up the newest previous one,
      # so the corpus accumulates across nights.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-

      # The cargo cache above carries ~/.cargo/bin, so a restored cache already
      # has the binary and a plain `cargo install` aborts with "binary
      # `cargo-fuzz` already exists in destination" (exit 101) before the fuzz
      # step ever runs. Install only when it is genuinely missing.
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Fuzz (${{ github.event_name == 'schedule' && '10 min' || 'smoke' }})
        id: fuzz
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_TIME=600
          else
            MAX_TIME=20
          fi
          # Two corpus dirs: libFuzzer writes new inputs to the FIRST and reads
          # the rest. So the tracked seeds in fuzz/seeds/ stay read-only and the
          # run's own growth lands in the cached, gitignored fuzz/corpus/.
          mkdir -p "fuzz/corpus/$TARGET"
          cargo fuzz run "$TARGET" --fuzz-dir fuzz \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time=$MAX_TIME -rss_limit_mb=4096 -timeout=25
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
