# cargo-audit configuration.
#
# Default policy: a RUSTSEC "vulnerability" advisory is fixed by bumping the
# dependency, NOT ignored. The bulk of this list is therefore only for
# *informational* advisories (unmaintained / unsound) that we have reviewed and
# consciously accept because the fix requires a disruptive major upgrade or the
# crate has no maintained drop-in replacement.
#
# A vulnerability advisory is waived here ONLY when every one of these holds:
# the crate is reached transitively (not a direct dependency), there is no
# released upstream version that clears it, and the reachable surface is narrow
# and documented. Each such entry states the scope and the exact condition that
# unblocks its removal. Each entry — vulnerability or informational — records
# why it is here and what unblocks removing it.
#
# These conditions go stale silently, because a waived advisory keeps CI
# green whether or not the waiver is still needed. Re-check them
# periodically by running `cargo audit` from a directory without this file
# and confirming each entry below still applies.
# Last verified against crates.io: 2026-09-08.

[advisories]
ignore = [
    # lru — unsound `LruCache::pop()` if an element's Drop panics. Our own
    # `lru = "0.18"` resolves to 0.18.2, which carries the fix; the flagged
    # copy left is lru 0.16, held by azul-layout and mysql 28. Remove once
    # those parents release against >=0.18.2 — re-check by dropping this line
    # and reading which crate `cargo audit` still names.
    #
    # RUSTSEC-2026-0002 (lru 0.12.5, unsound `IterMut`) was waived beside this
    # one until 2026-09-08 and is gone: that copy came from `ratatui`, which
    # was declared in Cargo.toml and used by nothing.
    "RUSTSEC-2026-0253",

    # paste 1.0.15 — unmaintained proc-macro, no runtime risk. One parent left
    # (`cargo tree -i paste@1.0.15`): pulp, under exr, under image 0.24, under
    # umya-spreadsheet. Dropping ratatui removed the other.
    "RUSTSEC-2024-0436",

    # daemonize — unmaintained. Used only for `soli serve -d` (Unix daemonize).
    # Small, stable surface; revisit if a maintained equivalent appears.
    "RUSTSEC-2025-0069",

    # proc-macro-error 1.0.4 — unmaintained proc-macro (build-time only, no
    # runtime risk). Reached through the PDF font stack via allsorts 0.16 →
    # ouroboros 0.17, which pins it; ouroboros >=0.18 uses proc-macro-error2.
    #
    # The blocker is NOT allsorts upstream: allsorts 0.17.0 already requires
    # ouroboros ^0.18. Our printpdf is vendored (pdf/vendor/printpdf), so its
    # allsorts pin is ours to change — but bumping it alone does not help.
    # Tried 2026-09: it compiles, and `azul-layout` 0.0.7 and `rust-fontconfig`
    # 2.0.0 still require allsorts ^0.16, so the tree ends up carrying both
    # copies and the advisory stays. Those two crates are the real blocker.
    "RUSTSEC-2024-0370",

    # rustybuzz 0.20.1 — unmaintained text-shaping crate, no runtime risk.
    # Transitive via resvg/usvg 0.45 (SVG rendering for soli-pdf). Genuinely
    # blocked: 0.20.1 is still the newest published rustybuzz (checked
    # 2026-09), so there is nothing to move to. Unblocked when the crate is
    # adopted and resvg ships against it.
    "RUSTSEC-2026-0206",

    # ttf-parser 0.25.1 — unmaintained font parser, no runtime risk. Transitive
    # via resvg/usvg/fontdb and lopdf (PDF + SVG font handling). Same situation
    # as rustybuzz above: 0.25.1 is still the newest published version
    # (checked 2026-09), so there is nothing to move to.
    "RUSTSEC-2026-0192",

    # rustls-pemfile 2.2.0 — unmaintained; its PEM parsing moved into
    # rustls-pki-types, which we now use directly for the Postgres CA path.
    # This copy is pulled transitively by the `mysql` crate's rustls backend
    # (mysql 28 -> rustls-pemfile) to read `ssl-ca` files, and nothing we
    # control can move it. Scope: parsing a CA bundle the operator points at, so
    # the input is already trusted. Unblocked when mysql switches to
    # rustls-pki-types' own PEM reader (then `cargo update -p mysql && cargo
    # audit`). Still blocked: mysql 28.0.2 is the newest release (checked
    # 2026-09) and still pulls it.
    "RUSTSEC-2025-0134",

    # instant 0.1.13 — unmaintained (a wasm-era Instant shim), build graph only
    # under the optional `eui-desktop` feature and no runtime risk. Chain:
    # eui-client -> notify 7 -> notify-types 1 -> instant. Absent from a default
    # build entirely, so `cargo audit` flags it from the lockfile rather than
    # from anything we compile.
    #
    # The fix is one line in another repository: notify-types 2.x dropped
    # `instant`, and reaching it needs notify 8, which
    # ../eui/crates/eui-client/Cargo.toml pins at "7". Remove this waiver once
    # eui-client moves to notify 8 (then `cargo update -p notify && cargo audit`).
    "RUSTSEC-2024-0384",
]
