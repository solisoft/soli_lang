<head>
<meta charset="utf-8">

<title>This address speaks EUI</title>
<meta name="description" content="A lighter way to send this page, and how to open it.">
<style>
:root {
  --ground: #0e1720; --raised: #16222e; --ink: #dde7ed; --muted: #8598a5;
  --line: #24323f; --ghost: #33444f;
  --html: #5d7f94; --eui: #8cbfa2; --act: #d3ad4e;
  --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #eef2f4; --raised: #e3e9ec; --ink: #16222e; --muted: #5a6b78;
    --line: #cdd7dd; --ghost: #b2c0c8; --html: #517087; --eui: #4e8f6c; --act: #8a6d13;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center;
  background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }

.mark { font-family: var(--mono); font-size: .78rem; letter-spacing: .18em; color: var(--muted); }
h1 {
  font-size: clamp(1.6rem, 1rem + 2.4vw, 2.4rem); line-height: 1.12;
  letter-spacing: -.022em; font-weight: 600; margin: 1.9rem 0 .9rem; max-width: 20ch;
}
.lede { color: var(--muted); margin: 0; max-width: 56ch; }

figure { margin: 2.4rem 0 0; }
.field { width: 100%; height: auto; display: block; }
.c.t { fill: none; stroke: var(--ghost); stroke-width: 1.1; }
.c.h { fill: var(--html); }
.c.e { fill: var(--eui); }
figcaption { margin: .85rem 0 0; color: var(--muted); font-size: .85rem; max-width: 60ch; }
figcaption b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.open { margin: 2.4rem 0 0; padding: 1.4rem 0 0; border-top: 1px solid var(--line); }
code.addr {
  display: block; font-family: var(--mono); font-size: .85rem; color: var(--ink);
  background: var(--raised); border: 1px solid var(--line); border-radius: 4px;
  padding: .7rem .85rem; overflow-x: auto; white-space: nowrap; margin: 0 0 1.1rem;
}
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem; }
a.get {
  background: var(--act); color: var(--ground); font-weight: 600; font-size: .94rem;
  text-decoration: none; padding: .6rem 1.15rem; border-radius: 4px;
}
a.get:hover { filter: brightness(1.08); }
a.plain { color: var(--muted); font-size: .9rem; text-underline-offset: .18em; }
a:focus-visible { outline: 2px solid var(--act); outline-offset: 3px; }
</style>
</head>
