# Built-in validation messages, embedded in the binary. An application's
# config/locales/*.yml overrides any key here, key by key.
# Every code below must exist in each catalog file (i18n::helpers tests).
en:
  errors:
    format: "{attribute} {message}"
    messages:
      blank: "can't be blank"
      taken: "has already been taken"
      invalid: "is invalid"
      not_a_number: "is not a number"
      too_short_one: "is too short (minimum is {count} character)"
      too_short_other: "is too short (minimum is {count} characters)"
      too_long_one: "is too long (maximum is {count} character)"
      too_long_other: "is too long (maximum is {count} characters)"
      greater_than_or_equal_to: "must be greater than or equal to {count}"
      less_than_or_equal_to: "must be less than or equal to {count}"
      inclusion: "is not included in the list"
      wrong_type: "must be {type}"
      value_object: "must be a {class}"
      value_object_list: "must be a list of {class}"
      foreign_key: "must reference an existing record"
      still_referenced: "is still referenced by other records"
      stale: "is stale: the record was changed since it was read — reload it and try again"
    types:
      string: "a string"
      int: "an int"
      integer: "an integer"
      float: "a float"
      number: "a number"
      bool: "a bool"
      boolean: "a boolean"
      array: "an array"
      hash: "a hash"
