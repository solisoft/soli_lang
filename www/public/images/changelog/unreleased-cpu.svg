<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 368" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="CPU per request, v2.18.4 against now: a 50-row list page 56.9 to 46.8 microseconds, an action reading row.title.upcase over 50 rows 44.6 to 36.4, an action behind a policy.send hook 37.4 to 31.2, render_json of a hash unchanged at 15.8.">
<rect width="920" height="368" fill="#0b0d0f"/>
<style>.t{fill:#f3f4f6;font-size:15px;font-weight:700}.l{fill:#e5e7eb;font-size:12px;font-weight:600}.s{fill:#6b7280;font-size:11px}.v{fill:#e5e7eb;font-size:11px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.d{font-size:12px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<text class="t" x="20" y="32">CPU per request since v2.18.4 — <tspan fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">soli serve</tspan> in production</text>
<text class="s" x="20" y="52">16 workers on 16 threads of a Ryzen 9 9950X, oha on 8 others, 200 connections; 2 interleaved starts per build, which agreed within 1%.</text>
<text class="s" x="20" y="68">Each row is one measured change (the list page: two, chained). Shorter is better; requests per second at the right.</text>
<rect x="20" y="84" width="12" height="12" rx="2" fill="#4b5563"/><text class="s" x="38" y="94" fill="#9ca3af">before</text>
<rect x="100" y="84" width="12" height="12" rx="2" fill="#34d399"/><text class="s" x="118" y="94" fill="#9ca3af">now</text>
<text class="s" x="772" y="108">CPU</text><text class="s" x="900" y="108" text-anchor="end">req/s</text>
<line x1="310.0" y1="114" x2="310.0" y2="318" stroke="#1f2937"/>
<text class="s" x="310.0" y="334" text-anchor="middle">0 µs</text>
