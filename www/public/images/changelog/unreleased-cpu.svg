<text class="s" x="435.7" y="334" text-anchor="middle">20 µs</text>
<line x1="561.4" y1="114" x2="561.4" y2="318" stroke="#1f2937"/>
<text class="s" x="561.4" y="334" text-anchor="middle">40 µs</text>
<line x1="687.1" y1="114" x2="687.1" y2="318" stroke="#1f2937"/>
<text class="s" x="687.1" y="334" text-anchor="middle">60 µs</text>
<text class="l" x="298" y="131" text-anchor="end">A 50-row list page</text>
<text class="s" x="298" y="147" text-anchor="end">template fixes + views on the VM</text>
<rect x="310" y="120" width="357.7" height="14" rx="4" fill="#4b5563"/>
<text class="v" x="673.7" y="131" fill="#9ca3af">56.9 µs</text>
<rect x="310" y="137" width="294.2" height="14" rx="4" fill="#34d399"/>
<text class="v" x="610.2" y="148">46.8 µs</text>
<text class="d" x="772" y="140" fill="#34d399">−18%</text>
<text class="s" x="900" y="131" text-anchor="end">247k</text>
<text class="s" x="900" y="148" text-anchor="end" fill="#9ca3af">295k</text>
<text class="l" x="298" y="183" text-anchor="end">row.title.upcase in an action</text>
<text class="s" x="298" y="199" text-anchor="end">dot reads and bare methods on the VM</text>
