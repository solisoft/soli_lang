<text class="v" x="544.8" y="200">36.4 µs</text>
<text class="d" x="772" y="192" fill="#34d399">−18%</text>
<text class="s" x="900" y="183" text-anchor="end">310k</text>
<text class="s" x="900" y="200" text-anchor="end" fill="#9ca3af">372k</text>
<text class="l" x="298" y="235" text-anchor="end">An action behind a policy.send hook</text>
<text class="s" x="298" y="251" text-anchor="end">instance send on the VM</text>
<rect x="310" y="224" width="235.1" height="14" rx="4" fill="#4b5563"/>
