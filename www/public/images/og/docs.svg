<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Soli documentation — the language, the framework and everything else that ships in the soli binary.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=block');
    .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -2px; }
    .sans { font-family: 'Instrument Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <rect width="1200" height="630" fill="#1C1814"/>
  <circle cx="1080" cy="40" r="430" fill="none" stroke="#E8590C" stroke-opacity="0.3"/>
  <circle cx="1080" cy="40" r="300" fill="none" stroke="#E8590C" stroke-opacity="0.45"/>
  <circle cx="1080" cy="40" r="180" fill="#E8590C" fill-opacity="0.14"/>

  <g transform="translate(72 70)">
    <circle cx="10" cy="-8" r="10" fill="#E8590C"/>
    <text x="32" y="0" class="serif" font-size="34" fill="#F6F1E7" letter-spacing="-1">Soli</text>
    <text x="118" y="0" class="mono" font-size="22" fill="#F2A365">/ docs</text>
  </g>

  <text x="72" y="250" class="serif" font-size="88" fill="#F6F1E7">Everything in</text>
  <text x="72" y="350" class="serif" font-size="88" fill="#E8590C" font-style="italic">one binary.</text>

  <text x="74" y="418" class="sans" font-size="26" fill="#C9BFAE">The language, the MVC framework, the ORM, views, jobs,</text>
  <text x="74" y="454" class="sans" font-size="26" fill="#C9BFAE">mail, PDF, live views, tests and deploy — documented.</text>

  <line x1="72" y1="522" x2="1128" y2="522" stroke="#3A332B"/>
  <g class="mono" font-size="20" fill="#A69C8C">
    <text x="72" y="566">Getting started · Language · Routing · Models · Views · Testing</text>
    <text x="1128" y="566" text-anchor="end" fill="#F2A365">soli.solisoft.net/docs</text>
  </g>
</svg>
