<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Soli — Write it like Ruby. Serve it like Rust. A programming language with a complete web framework built in: models, auth, jobs, mail, PDF, WebSockets, live views and tests in one binary.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=block');
    .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -2px; }
    .sans { font-family: 'Instrument Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .code text { white-space: pre; }
  </style>

  <rect width="1200" height="630" fill="#F6F1E7"/>

  <!-- Sun motif, as in the landing hero -->
  <circle cx="1080" cy="40" r="430" fill="none" stroke="#E8590C" stroke-opacity="0.35"/>
  <circle cx="1080" cy="40" r="300" fill="none" stroke="#E8590C" stroke-opacity="0.5"/>
  <circle cx="1080" cy="40" r="180" fill="#E8590C" fill-opacity="0.12"/>

  <!-- Wordmark -->
  <g transform="translate(72 70)">
    <circle cx="10" cy="-8" r="10" fill="#E8590C"/>
    <text x="32" y="0" class="serif" font-size="34" fill="#1B1712" letter-spacing="-1">Soli</text>
  </g>

  <!-- Headline -->
  <text x="72" y="236" class="serif" font-size="80" fill="#1B1712">Write it like Ruby.</text>
  <text x="72" y="330" class="serif" font-size="80" fill="#E8590C" font-style="italic">Serve it like Rust.</text>

  <!-- Lead -->
  <text x="74" y="394" class="sans" font-size="26" fill="#4A4238">A language with a web framework built in:</text>
  <text x="74" y="430" class="sans" font-size="26" fill="#4A4238">models, auth, jobs, mail, PDF, live views</text>
  <text x="74" y="466" class="sans" font-size="26" fill="#4A4238">and tests, all in one binary.</text>

  <!-- Proof strip -->
  <line x1="72" y1="522" x2="1128" y2="522" stroke="#D8CFBE"/>
  <g class="sans" font-size="22" fill="#6B6153">
    <text x="72" y="568"><tspan class="serif" font-size="30" fill="#1B1712" letter-spacing="-1">1.2M+</tspan>  requests / second</text>
    <text x="420" y="568"><tspan class="serif" font-size="30" fill="#1B1712" letter-spacing="-1">0</tspan>  dependencies to install</text>
    <text x="760" y="568" class="mono" font-size="22" fill="#B4400B">soli.solisoft.net</text>
  </g>

  <!-- Code panel -->
  <g transform="translate(704 160)">
    <rect width="424" height="276" rx="18" fill="#1C1814"/>
    <line x1="0" y1="44" x2="424" y2="44" stroke="#2E2822"/>
    <text x="24" y="28" class="mono" font-size="14" fill="#A69C8C">app/controllers/posts_controller.sl</text>
    <g class="mono code" font-size="17" xml:space="preserve">
      <text x="24" y="86"><tspan fill="#F2A365">class</tspan><tspan fill="#E9E2D6"> PostsController &lt; Controller</tspan></text>
      <text x="24" y="122" fill="#A69C8C">  # GET /posts</text>
      <text x="24" y="150"><tspan fill="#F2A365">  def</tspan><tspan fill="#E9E2D6"> index(req)</tspan></text>
      <text x="24" y="178"><tspan fill="#8FB8DE">    @posts</tspan><tspan fill="#E9E2D6"> = Post.all</tspan></text>
      <text x="24" y="206" fill="#F2A365">  end</text>
      <text x="24" y="234" fill="#F2A365">end</text>
    </g>
  </g>
</svg>
