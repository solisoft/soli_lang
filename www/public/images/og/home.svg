<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Soli: Write it like Ruby. Serve it like Rust. Fifty database rows rendered into an HTML page, same machine, 16 threads per stack: Soli 299,012 requests a second, Kemal 192,564, Phoenix 72,263, Rails and Puma 25,024, Django 10,896.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=block');
    .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -2px; }
    .sans { font-family: 'Instrument Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <rect width="1200" height="630" fill="#F6F1E7"/>

  <!-- Wordmark and address -->
  <g transform="translate(72 70)">
    <circle cx="10" cy="-8" r="10" fill="#E8590C"/>
    <text x="32" y="0" class="serif" font-size="34" fill="#1B1712" letter-spacing="-1">Soli</text>
  </g>
  <text x="1128" y="70" class="mono" font-size="20" text-anchor="end" fill="#B4400B">soli.solisoft.net</text>

  <!-- Headline -->
  <text x="70" y="172" class="serif" font-size="76" fill="#1B1712">Write it like Ruby.</text>
  <text x="70" y="248" class="serif" font-size="76" fill="#1B1712">Serve it like Rust.</text>

  <!-- The hero's load ramp, finished: each bar at the throughput measured for
       its stack (Database read + HTML render, /docs/getting-started/benchmarks) -->
  <rect x="72" y="296" width="1056" height="270" rx="18" fill="#FFFDF8" stroke="#E3DAC8"/>
  <text x="104" y="332" class="sans" font-size="19" fill="#6B6153">50 database rows rendered into an HTML page. Same machine, 16 threads per stack.</text>
  <line x1="104" y1="350" x2="1096" y2="350" stroke="#E3DAC8"/>
  <g>
    <text x="104" y="382" class="sans" font-size="20" font-weight="600" fill="#B4400B">Soli</text>
    <rect x="300" y="370" width="600" height="12" rx="6" fill="#EADFC9"/>
    <rect x="300" y="370" width="600.0" height="12" rx="6" fill="#E8590C"/>
    <text x="1096" y="382" class="mono" font-size="18" text-anchor="end" fill="#1B1712">299,012 <tspan fill="#6B6153">req/s</tspan></text>
    <text x="104" y="420" class="sans" font-size="20" font-weight="600" fill="#1B1712">Kemal</text>
    <rect x="300" y="408" width="600" height="12" rx="6" fill="#EADFC9"/>
    <rect x="300" y="408" width="386.4" height="12" rx="6" fill="#6B6153"/>
    <text x="1096" y="420" class="mono" font-size="18" text-anchor="end" fill="#1B1712">192,564 <tspan fill="#6B6153">req/s</tspan></text>
    <text x="104" y="458" class="sans" font-size="20" font-weight="600" fill="#1B1712">Phoenix</text>
    <rect x="300" y="446" width="600" height="12" rx="6" fill="#EADFC9"/>
    <rect x="300" y="446" width="145.0" height="12" rx="6" fill="#6B6153"/>
    <text x="1096" y="458" class="mono" font-size="18" text-anchor="end" fill="#1B1712">72,263 <tspan fill="#6B6153">req/s</tspan></text>
    <text x="104" y="496" class="sans" font-size="20" font-weight="600" fill="#1B1712">Rails + Puma</text>
    <rect x="300" y="484" width="600" height="12" rx="6" fill="#EADFC9"/>
    <rect x="300" y="484" width="50.2" height="12" rx="6" fill="#6B6153"/>
    <text x="1096" y="496" class="mono" font-size="18" text-anchor="end" fill="#1B1712">25,024 <tspan fill="#6B6153">req/s</tspan></text>
    <text x="104" y="534" class="sans" font-size="20" font-weight="600" fill="#1B1712">Django</text>
    <rect x="300" y="522" width="600" height="12" rx="6" fill="#EADFC9"/>
    <rect x="300" y="522" width="21.9" height="12" rx="6" fill="#6B6153"/>
    <text x="1096" y="534" class="mono" font-size="18" text-anchor="end" fill="#1B1712">10,896 <tspan fill="#6B6153">req/s</tspan></text>
  </g>
</svg>
