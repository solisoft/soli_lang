<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Release channel pipeline: signed build, canary soak, then stable promote. A P-256 signature protects latest.json; bad binaries never replace the install.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1023" height="575" fill="none" stroke="#1c1f26"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="32" font-weight="700" fill="#f4f4f5">Operating a release channel</text>
  <text x="48" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#8b929e">Sign once. Canary first. Promote only what survived. Never overwrite a version.</text>

  <!-- Key chip top-right -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect x="720" y="32" width="256" height="64" rx="12" fill="#12151b" stroke="#3a2f14"/>
    <text x="740" y="56" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#f59e0b">P-256 SIGNING KEY</text>
    <text x="740" y="78" font-size="13" fill="#e5e7eb">priv → secrets · pub → build</text>
  </g>

  <!-- Stage 1: Build -->
  <g>
    <rect x="40" y="140" width="220" height="200" rx="14" fill="#101319" stroke="#2b3038"/>
    <rect x="40" y="140" width="220" height="36" rx="14" fill="#151922"/>
    <rect x="40" y="160" width="220" height="16" fill="#151922"/>
    <text x="56" y="164" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">1 · Build</text>
    <text x="56" y="210" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">version  <tspan fill="#f59e0b">1.2.0</tspan></text>
    <text x="56" y="236" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">targets  4 platforms</text>
    <text x="56" y="262" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">embed    pubkey</text>
    <text x="56" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">*.update.json stubs</text>
    <text x="56" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">sha256 per artifact</text>
  </g>

  <path d="M268 240 L 300 240" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Canary -->
  <g>
    <rect x="312" y="140" width="220" height="200" rx="14" fill="#101319" stroke="#3a2f14"/>
    <rect x="312" y="140" width="220" height="36" rx="14" fill="#1a1510"/>
    <rect x="312" y="160" width="220" height="16" fill="#1a1510"/>
    <text x="328" y="164" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">2 · Canary</text>
    <text x="328" y="210" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">base     <tspan fill="#e5e7eb">…/my_app-canary</tspan></text>
    <text x="328" y="236" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">path     /stable/latest.json</text>
    <text x="328" y="262" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">fleet    dogfood only</text>
    <rect x="328" y="286" width="100" height="28" rx="8" fill="#1a2e1f" stroke="#166534"/>
    <text x="344" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">soak 48h</text>
  </g>

  <path d="M540 240 L 572 240" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Stable -->
  <g>
    <rect x="584" y="140" width="220" height="200" rx="14" fill="#101319" stroke="#14532d"/>
    <rect x="584" y="140" width="220" height="36" rx="14" fill="#0f1f16"/>
    <rect x="584" y="160" width="220" height="16" fill="#0f1f16"/>
    <text x="600" y="164" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#86efac">3 · Promote stable</text>
    <text x="600" y="210" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">base     <tspan fill="#e5e7eb">…/my_app</tspan></text>
    <text x="600" y="236" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">same     artifacts + sha256</text>
    <text x="600" y="262" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9aa4b2">action   re-sign latest.json</text>
    <rect x="600" y="286" width="128" height="28" rx="8" fill="#1a2e1f" stroke="#166534"/>
    <text x="616" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">full fleet</text>
  </g>

  <path d="M812 240 L 844 240" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <!-- Clients -->
  <g>
    <rect x="856" y="170" width="128" height="140" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="872" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Clients</text>
    <text x="872" y="232" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2">verify sig</text>
    <text x="872" y="254" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2">check sha</text>
    <text x="872" y="276" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9aa4b2">atomic swap</text>
  </g>

  <!-- Bottom: trust rules -->
  <g>
    <rect x="40" y="380" width="944" height="156" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="64" y="416" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Trust rules baked into the client</text>

    <!-- three pills -->
    <rect x="64" y="440" width="280" height="72" rx="12" fill="#12151b" stroke="#2b3038"/>
    <text x="84" y="468" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f59e0b">Signed manifest</text>
    <text x="84" y="492" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">P-256 ECDSA vs embedded pubkey</text>

    <rect x="372" y="440" width="280" height="72" rx="12" fill="#12151b" stroke="#2b3038"/>
    <text x="392" y="468" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#22c55e">sha256-gated download</text>
    <text x="392" y="492" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">Tamper or truncate → refuse</text>

    <rect x="680" y="440" width="280" height="72" rx="12" fill="#12151b" stroke="#3f1d1d"/>
    <text x="700" y="468" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ef4444">No silent downgrade</text>
    <text x="700" y="492" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">Rollback = ship a higher version</text>
  </g>
</svg>
