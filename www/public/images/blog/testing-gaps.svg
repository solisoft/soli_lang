<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576" role="img" aria-label="The Honest Gaps list for testing and data, each entry checked against the code. Closed: no way to run one test became soli test --filter or -n; no fail-fast became --fail-fast; no watch mode became --watch, rerun in a fresh process; one-step rollbacks became db:migrate down --step N and --to VERSION; no mocking framework became Mock, Mock.stub_class and Mock.stub_instance; no OIDC client-credentials grant became grant_types. Still open: resumable uploads and in-process TLS. Already built, only the task files were stale: OpenTelemetry export and find_each. On the right, a Mock test double stubs charge, the checkout pays 1200, and assert_received checks the call; below, soli test --watch --fail-fast --filter Checkout.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="40" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e5e7eb">Closing the testing gaps <tspan fill="#f59e0b">·</tspan> a list that got shorter</text>
  <text x="40" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#8b929e">every "Honest Gaps" entry checked against the code before any was written</text>

  <!-- GAP LIST -->
  <rect x="40" y="104" width="580" height="436" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="64" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" letter-spacing="1.5">CLOSED</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <g fill="#6b7280" text-decoration="line-through">
      <text x="64" y="172">no way to run one test</text>
      <text x="64" y="208">no fail-fast</text>
      <text x="64" y="244">no watch mode</text>
      <text x="64" y="280">rollback one step at a time</text>
      <text x="64" y="316">no mocking framework</text>
      <text x="64" y="352">no client_credentials grant</text>
    </g>

    <g stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M288 168 H318"/>
      <path d="M288 204 H318"/>
      <path d="M288 240 H318"/>
      <path d="M288 276 H318"/>
      <path d="M288 312 H318"/>
      <path d="M288 348 H318"/>
    </g>

    <g fill="#e5e7eb">
      <text x="328" y="172">soli test <tspan fill="#22c55e">--filter</tspan> / <tspan fill="#22c55e">-n</tspan></text>
      <text x="328" y="208">soli test <tspan fill="#22c55e">--fail-fast</tspan></text>
      <text x="328" y="244">soli test <tspan fill="#22c55e">--watch</tspan> <tspan fill="#8b929e">fresh process</tspan></text>
      <text x="328" y="280">down <tspan fill="#22c55e">--step N</tspan> · <tspan fill="#22c55e">--to V</tspan></text>
      <text x="328" y="316"><tspan fill="#22c55e">Mock</tspan> · stub_class · stub_instance</text>
      <text x="328" y="352">OIDC <tspan fill="#22c55e">grant_types</tspan></text>
    </g>
  </g>

  <line x1="64" y1="378" x2="596" y2="378" stroke="#2b3038"/>

  <text x="64" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="1.5">STILL OPEN</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e5e7eb">
    <text x="64" y="440">resumable uploads</text>
    <text x="328" y="440">in-process TLS</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b929e">
    <text x="64" y="460">a protocol of its own</text>
    <text x="328" y="460">a reverse proxy, by design</text>
  </g>

  <line x1="64" y1="482" x2="596" y2="482" stroke="#2b3038"/>
  <text x="64" y="512" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b929e">Already built, the task files were stale: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e5e7eb">OpenTelemetry export</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e5e7eb">find_each</tspan></text>

  <!-- MOCK -->
  <rect x="644" y="104" width="340" height="300" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="668" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb" letter-spacing="1.5">A TEST DOUBLE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e5e7eb" xml:space="preserve">
    <text x="668" y="172">gateway = <tspan fill="#f59e0b">new Mock</tspan>("gateway", {</text>
    <text x="668" y="192">  "charge": fn(amount) {</text>
    <text x="668" y="212">    {"ok": true}</text>
    <text x="668" y="232">  }</text>
    <text x="668" y="252">})</text>
    <text x="668" y="284">Checkout.new(gateway).pay(1200)</text>
    <text x="668" y="316">gateway.<tspan fill="#22c55e">assert_received</tspan>(</text>
    <text x="668" y="336">  "charge", [1200])</text>
  </g>
  <text x="668" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b929e">every call recorded · a message with no stub throws</text>
  <text x="668" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b929e">stubs cleared after every test</text>

  <!-- TERMINAL -->
  <rect x="644" y="420" width="340" height="120" rx="14" fill="#0b0d10" stroke="#d97706"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve">
    <text x="668" y="454" fill="#8b929e">$ <tspan fill="#e5e7eb">soli test --watch</tspan></text>
    <text x="668" y="476" fill="#e5e7eb">    --fail-fast</text>
    <text x="668" y="498" fill="#e5e7eb">    --filter "Checkout"</text>
    <text x="668" y="524" fill="#22c55e" font-size="12">rerun on save · stop at the first failure</text>
  </g>
</svg>
