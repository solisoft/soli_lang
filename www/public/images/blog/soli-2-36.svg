<svg style="font-variant-ligatures:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Soli 2.36, see what your code does. A paused debugger frame on the left: a controller action stopped at a breakpoint on line 12, with its locals. On the right, five cards: Debugger (soli dap, VS Code, attach to soli serve with --inspect, conditional breakpoints and logpoints, --profile=alloc); Types (Int | String | nil, class Box&lt;T&gt;, # soli: strict, soli check reads the views); Errors (a declared-here frame, did-you-mean on both engines, named errors on the dev page); Editor (references and rename across the app, view @x warnings, a tree-sitter grammar); Production (passkeys with EdDSA, native apps and a virtual authenticator; presence and ws_send across instances over SoliDB or SoliKV).">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#08090b"/></linearGradient></defs>
<rect width="1024" height="576" fill="url(#bg)"/>
<text x="40" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e5e7eb">Soli 2.36 <tspan fill="#f59e0b">· see what your code does</tspan></text>
<text x="40" y="98" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#8b929e">A step debugger, types across the app, errors that show both ends, an editor that knows the whole project.</text>

<!-- Debugger frame -->
<rect x="40" y="126" width="420" height="410" rx="14" fill="#101319" stroke="#2b3038"/>
