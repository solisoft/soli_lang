<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A documentation page served as one render from GET /_eui/view with an ETag and no session held for its reader, containing one amber island node whose content comes from its own session at /_eui/session/comments?for=1042. Beside it, a dropped socket reconnects: the client offers its sixteen-byte handle and the sequence of the last batch it applied, and the server answers Welcome Resumed followed only by the batches it missed, from the last sixty-four kept for two minutes. A footer compares 50 to 60 kB held per reading socket against a 4 799 byte page, and six hundred one-shot renders moving resident memory by four kilobytes.">
  <defs>
    <linearGradient id="isl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="isl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="isl-arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b929e"/>
    </marker>
    <marker id="isl-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#isl-bg)"/>
  <rect x="0.5" y="0.5" width="1023" height="575" fill="none" stroke="#1c1f26"/>

  <text x="56" y="66" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="32" font-weight="700" fill="#f4f4f5">Still pages, live corners, sockets that come back</text>
  <text x="56" y="96" font-family="system-ui, sans-serif" font-size="16" fill="#8b929e">A page costs one render. An island costs one session. A dropped socket costs only the batches it missed.</text>

  <!-- Left: the page, one render -->
  <rect x="56" y="126" width="440" height="342" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="80" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">The page — one render, nothing held</text>
  <text x="80" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">GET /_eui/view/site  →  200 · ETag · 304</text>

  <!-- page mock -->
  <rect x="80" y="192" width="392" height="252" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
  <rect x="100" y="212" width="190" height="14" rx="4" fill="#3a404b"/>
  <rect x="100" y="240" width="352" height="8" rx="3" fill="#252a33"/>
  <rect x="100" y="256" width="330" height="8" rx="3" fill="#252a33"/>
  <rect x="100" y="272" width="344" height="8" rx="3" fill="#252a33"/>
  <rect x="100" y="288" width="260" height="8" rx="3" fill="#252a33"/>
  <rect x="100" y="312" width="352" height="8" rx="3" fill="#252a33"/>
  <rect x="100" y="328" width="300" height="8" rx="3" fill="#252a33"/>

  <!-- the island -->
  <rect x="100" y="354" width="352" height="72" rx="8" fill="#1a1407" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="116" y="376" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">"island": "/_eui/session/comments?for=1042"</text>
  <text x="116" y="398" font-family="system-ui, sans-serif" font-size="13" fill="#e5e7eb">3 comments</text>
  <text x="116" y="416" font-family="system-ui, sans-serif" font-size="11" fill="#8b929e">the cached children show until the island speaks</text>

  <!-- arrow island -> session -->
  <path d="M452 390 C 500 390, 510 214, 548 214" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#isl-arrow)"/>

  <!-- Right top: island session -->
  <rect x="552" y="126" width="416" height="150" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="576" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">The island — a session of its own</text>
  <text x="576" y="182" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">connect  params {"for": "1042", "viewport": …}</text>
  <text x="576" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">its own ids, its own four interned tables</text>
  <text x="576" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">one session per distinct path · at most 8 open</text>
  <text x="576" y="246" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">same origin only · nothing added to the wire</text>
  <text x="576" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">fails → the page is out of date, not broken</text>

  <!-- Right bottom: resume -->
  <rect x="552" y="296" width="416" height="172" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="576" y="326" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">The socket drops — the session doesn't</text>
  <text x="576" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">client</text>
  <text x="918" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">server</text>
  <line x1="600" y1="364" x2="936" y2="364" stroke="#8b929e" stroke-width="1.4" marker-end="url(#isl-arrow-grey)"/>
  <text x="604" y="358" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">Hello  resume 0x01  handle:16  acked:n</text>
  <line x1="936" y1="392" x2="600" y2="392" stroke="#22c55e" stroke-width="1.4" marker-end="url(#isl-arrow-green)"/>
  <text x="604" y="386" font-family="ui-monospace, monospace" font-size="11" fill="#22c55e">Welcome{Resumed}</text>
  <line x1="936" y1="420" x2="600" y2="420" stroke="#22c55e" stroke-width="1.4" marker-end="url(#isl-arrow-green)"/>
  <text x="604" y="414" font-family="ui-monospace, monospace" font-size="11" fill="#22c55e">Batch n+1 … only what it missed</text>
  <text x="576" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">no connect · no resync · no tree — last 64 batches, 2 min</text>

  <!-- footer numbers -->
  <rect x="56" y="490" width="912" height="54" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="80" y="513" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">a socket per reader</text>
  <text x="80" y="533" font-family="ui-monospace, monospace" font-size="14" fill="#ef4444">50–60 kB held <tspan fill="#8b929e">vs a 4 799 B page</tspan></text>
  <text x="420" y="513" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">600 distinct one-shot renders</text>
  <text x="420" y="533" font-family="ui-monospace, monospace" font-size="14" fill="#22c55e">+4 kB resident</text>
  <text x="700" y="513" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">one eui-site page, one URL</text>
  <text x="700" y="533" font-family="ui-monospace, monospace" font-size="14" fill="#e5e7eb">60 650 B HTML · <tspan fill="#f59e0b">296 B EUI</tspan></text>
</svg>
