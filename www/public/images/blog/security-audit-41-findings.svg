<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="An audit's 41 findings. The first round closed 36 and partly closed 5; a follow-up closed four of those five, leaving the locale lookup order open. Three groups of fixes: security gates (reserved /__ paths answer 404, --dev endpoints need a local Host, per-client upload budget, SOLI_TRUSTED_PROXIES honoured by async origin checks), leaks in long-lived workers (in-memory sessions swept and capped, request logs reset per event, SSE subscribers pruned, a 350 KB builtins registry no longer kept per throwaway interpreter), and hot-path costs (zero-argument actions on the VM, no CREATE TABLE per write, queued requests woken instead of polled). A cargo audit card shows the waiver file going from eleven entries to ten as quick-xml moves from 0.31 to 0.41, clearing RUSTSEC-2026-0194 and -0195, while h2 0.3.27 stays waived for the S3 client.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.32" y1="0.28" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2620c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>

  <!-- title -->
  <text x="56" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e5e7eb" font-weight="600">an audit's 41 findings</text>
  <text x="56" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b929e">server · builtins · ORM · interpreter/VM — shipped in v2.5.0</text>

  <!-- left: the count -->
  <rect x="56" y="118" width="260" height="400" rx="14" fill="#101319" stroke="#2b3038"/>
  <circle cx="84" cy="146" r="8" fill="url(#sun)"/>
  <text x="102" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b929e">findings</text>
  <text x="80" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="88" fill="#f59e0b" font-weight="700">41</text>

  <!-- 36 / 5 bar: 212px wide, 36/41 = 186px -->
  <rect x="80" y="274" width="186" height="14" rx="3" fill="#22c55e"/>
  <rect x="268" y="274" width="24" height="14" rx="3" fill="#f59e0b"/>
  <text x="80" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#22c55e">36 closed</text>
  <text x="188" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f59e0b">5 partly</text>
  <text x="80" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">027e732d</text>

  <line x1="80" y1="348" x2="292" y2="348" stroke="#2b3038"/>
  <text x="80" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e5e7eb">follow-up ec8b3283</text>
  <text x="80" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#22c55e">4 of the 5 closed</text>
  <text x="80" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">bind names · cycles</text>
  <text x="80" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">lockfile hash · enqueue poll</text>
  <text x="80" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f59e0b">still open:</text>
  <text x="80" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e5e7eb">locale lookup order</text>

  <!-- middle: three groups -->
  <!-- security -->
  <rect x="340" y="118" width="364" height="140" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="362" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f59e0b" font-weight="600">security gates</text>
  <text x="362" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">/__soli/ … unclaimed → 404, not /:slug</text>
  <text x="362" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">--dev endpoints need a local Host</text>
  <text x="362" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">body budget: 64 KiB, doubling, per IP</text>
  <text x="362" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">SOLI_TRUSTED_PROXIES on async checks</text>

  <!-- leaks -->
  <rect x="340" y="272" width="364" height="140" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="362" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f59e0b" font-weight="600">long-lived workers</text>
  <text x="362" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">in-memory sessions swept, capped 100000</text>
  <text x="362" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">request logs reset per event, cap 10k</text>
  <text x="362" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">SSE subscribers on quiet topics freed</text>
  <text x="362" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">~350 KB registry per interpreter: gone</text>

  <!-- hot paths -->
  <rect x="340" y="426" width="364" height="92" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="362" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f59e0b" font-weight="600">hot paths</text>
  <text x="362" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">zero-arg actions on the VM</text>
  <text x="362" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">no CREATE TABLE per write · no 1 ms poll</text>

  <!-- right: cargo audit -->
  <rect x="728" y="118" width="240" height="400" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="750" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f59e0b" font-weight="600">cargo audit</text>
  <text x="750" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">.cargo/audit.toml</text>

  <text x="750" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#e5e7eb" font-weight="600">11 → 10</text>
  <text x="750" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">waiver entries</text>

  <text x="750" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e5e7eb">quick-xml 0.31 → 0.41</text>
  <rect x="750" y="286" width="198" height="24" rx="6" fill="#1a0e0e" stroke="#5a1d1d"/>
  <text x="760" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ef4444" text-decoration="line-through">RUSTSEC-2026-0194</text>
  <rect x="750" y="316" width="198" height="24" rx="6" fill="#1a0e0e" stroke="#5a1d1d"/>
  <text x="760" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ef4444" text-decoration="line-through">RUSTSEC-2026-0195</text>
  <text x="750" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#22c55e">spreadsheet DoS: fixed</text>

  <line x1="750" y1="384" x2="946" y2="384" stroke="#2b3038"/>
  <text x="750" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#f59e0b">still waived</text>
  <text x="750" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e5e7eb">RUSTSEC-2026-0258</text>
  <text x="750" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">h2 0.3.27, S3 client only</text>
  <text x="750" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">+ 9 unmaintained /</text>
  <text x="750" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b929e">  unsound notices</text>

  <!-- footer -->
  <text x="56" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b929e">the check existed — it just wasn't where the request went</text>
</svg>
