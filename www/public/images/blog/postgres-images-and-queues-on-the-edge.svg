<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A Soli app inside a Cloudflare Worker, 2.94 MB compressed. Requests and queue messages enter it. It stores uploads in R2 and serves them back with Range and Cloudflare Images transforms, reads and writes Postgres through Hyperdrive with the pg driver, and sends background jobs to Cloudflare Queues, which hand them back to the Worker's queue handler.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="512" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb">Postgres, images and queues on the edge</text>
  <text x="512" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b929e">what a real app reaches for, inside a Worker that still fits the free plan</text>

  <!-- inputs -->
  <rect x="36" y="196" width="150" height="74" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="111" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">Request</text>
  <text x="111" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">POST /photos</text>
  <line x1="188" y1="233" x2="268" y2="233" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="36" y="330" width="150" height="74" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="111" y="362" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">queue()</text>
  <text x="111" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">a batch of jobs</text>
  <line x1="188" y1="367" x2="268" y2="367" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- worker -->
  <rect x="272" y="150" width="300" height="300" rx="20" fill="#121212" stroke="#f59e0b" stroke-width="2"/>
  <text x="422" y="188" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">Cloudflare Worker</text>
  <rect x="300" y="208" width="244" height="120" rx="12" fill="#1a1a1a" stroke="#2b3038"/>
  <text x="422" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb">Soli, compiled to wasm</text>
  <text x="422" y="266" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">routes · controllers · views</text>
  <text x="422" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">models · app/jobs</text>
  <text x="422" y="312" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#22c55e">2.94 MB compressed</text>
  <rect x="300" y="344" width="244" height="80" rx="12" fill="#1a1a1a" stroke="#2b3038"/>
  <text x="422" y="374" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e5e7eb">worker.js</text>
  <text x="422" y="398" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">R2 objects · pg · queue send</text>

  <!-- services -->
  <line x1="574" y1="222" x2="676" y2="186" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="680" y="132" width="308" height="104" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="702" y="164" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">R2 + Cloudflare Images</text>
  <text x="702" y="190" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">uploads, video with Range / 304</text>
  <text x="702" y="212" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">photo.jpg?w=400&amp;fmt=webp</text>

  <line x1="574" y1="300" x2="676" y2="300" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="680" y="248" width="308" height="104" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="702" y="280" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">Hyperdrive → Postgres</text>
  <text x="702" y="306" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">the native adapter's SQL, via pg</text>
  <text x="702" y="328" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">transactions · table "orders"</text>

  <line x1="574" y1="378" x2="676" y2="414" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="680" y="364" width="308" height="104" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="702" y="396" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">Cloudflare Queues</text>
  <text x="702" y="422" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">perform_later, perform_in ≤ 12 h</text>
  <text x="702" y="444" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e">retries: 5 s, 11 s, 23 s…</text>

  <text x="512" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">soli edge build · npx wrangler deploy</text>
</svg>
