<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A Soli server builds a node tree from plain hashes, diffs it against the tree it last sent, and pushes only the difference as binary patches over a WebSocket to a native EUI client, which lays out and draws on the GPU. Deleting a note costs two ops. Events with their props travel back the other way.">
  <defs>
    <linearGradient id="eui-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="eui-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="eui-arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b929e"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#eui-bg)"/>
  <rect x="0.5" y="0.5" width="1023" height="575" fill="none" stroke="#1c1f26"/>

  <text x="56" y="68" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="34" font-weight="700" fill="#f4f4f5">A window, without a browser</text>
  <text x="56" y="100" font-family="system-ui, sans-serif" font-size="17" fill="#8b929e">The view returns <tspan font-family="ui-monospace, monospace" fill="#f59e0b">{"k", "s", "c"}</tspan> — plain Soli hashes. The runtime sends the difference. The client draws it.</text>

  <!-- Server (left) -->
  <g>
    <rect x="56" y="150" width="372" height="366" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="80" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Soli worker</text>
    <text x="80" y="202" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">notes_view(state)</text>

    <!-- node tree -->
    <rect x="80" y="220" width="324" height="164" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="96" y="244" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">column</text>
    <text x="116" y="266" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">├ text  <tspan fill="#e5e7eb">"Notes"</tspan></text>
    <text x="116" y="288" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">├ card</text>
    <text x="136" y="310" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">└ input + button</text>
    <text x="116" y="332" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">├ row  key="note:2"</text>
    <text x="116" y="354" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">└ text  <tspan fill="#e5e7eb">"1 of 2 done"</tspan></text>
    <text x="96" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">the tree this render built</text>

    <!-- diff -->
    <rect x="80" y="400" width="324" height="92" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="96" y="424" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">diff against the tree last sent</text>
    <text x="96" y="448" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e">RemoveChild  parent 8  at 1</text>
    <text x="96" y="468" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e">SetText      node 9  "1 of 1 done"</text>
    <text x="96" y="484" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">2 ops — nothing else moves</text>
  </g>

  <!-- Wire (middle) -->
  <g>
    <line x1="440" y1="286" x2="592" y2="286" stroke="#f59e0b" stroke-width="2" marker-end="url(#eui-arrow)"/>
    <text x="516" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">2 ops</text>
    <text x="516" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">binary patch</text>

    <line x1="592" y1="404" x2="440" y2="404" stroke="#8b929e" stroke-width="2" marker-end="url(#eui-arrow-back)"/>
    <text x="516" y="390" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">click the ×</text>
    <text x="516" y="426" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5b6270">props {id: 2}</text>

    <text x="516" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">WebSocket</text>
    <text x="516" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5b6270">/_eui/session/notes</text>
  </g>

  <!-- Client window (right) -->
  <g>
    <rect x="604" y="150" width="364" height="366" rx="14" fill="#101319" stroke="#2b3038"/>
    <rect x="604" y="150" width="364" height="34" rx="14" fill="#161a21"/>
    <rect x="604" y="170" width="364" height="14" fill="#161a21"/>
    <circle cx="626" cy="167" r="5" fill="#2b3038"/>
    <circle cx="644" cy="167" r="5" fill="#2b3038"/>
    <circle cx="662" cy="167" r="5" fill="#2b3038"/>
    <text x="786" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b929e">eui — native window</text>

    <text x="632" y="228" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="24" font-weight="700" fill="#e5e7eb">Notes</text>

    <rect x="632" y="248" width="308" height="52" rx="10" fill="#161a21" stroke="#2b3038"/>
    <rect x="646" y="262" width="228" height="24" rx="6" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="658" y="279" font-family="system-ui, sans-serif" font-size="12" fill="#5b6270">Buy milk</text>
    <rect x="884" y="262" width="44" height="24" rx="6" fill="#f59e0b"/>
    <text x="906" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0b0d0f">Add</text>

    <rect x="634" y="320" width="18" height="18" rx="4" fill="#f59e0b"/>
    <path d="M638 329 l3 3 l6 -6" fill="none" stroke="#0b0d0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="334" font-family="system-ui, sans-serif" font-size="14" fill="#8b929e">Ship v2.3.4</text>
    <text x="924" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5b6270">×</text>

    <rect x="634" y="356" width="18" height="18" rx="4" fill="none" stroke="#5b6270" stroke-width="2"/>
    <text x="662" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#e5e7eb">Write the EUI post</text>
    <text x="924" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5b6270">×</text>

    <text x="632" y="404" font-family="system-ui, sans-serif" font-size="12" fill="#5b6270">1 of 2 done</text>

    <rect x="632" y="432" width="308" height="60" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="648" y="454" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">laid out and drawn on the GPU</text>
    <text x="648" y="476" font-family="system-ui, sans-serif" font-size="11" fill="#5b6270">no HTML, no CSS, no JavaScript</text>
  </g>

  <text x="512" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6270">Colours are roles, not hex — the client resolves them against the viewer's light or dark palette.</text>
</svg>
