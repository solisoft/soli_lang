<svg style="font-variant-ligatures:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Soli 2.35. On the left, the four prompts of a Claude Code session that built a yoga studio booking site: schedule and back office, Stripe payments, live seats and email, specs. On the right, the eight places where the agent tripped, each with what 2.35 does now: class constants are read by name, try is a value, nested interpolation lexes, a bare save calls Model#save, soli new writes .env.test and a fresh app tests at 100%, scaffold specs pass, mailer views no longer double-escape, and an edited validation is replaced on a dev reload.">
