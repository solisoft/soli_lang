<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A native window titled Pocket Garden with four garden beds: a ripe radish with a red root, a sunflower with yellow petals, a strawberry bush with red berries and three lavender spikes. Beside it, a script file named garden.sl importing species.sl, beds.sl, shop.sl and herbarium.sl, and a clock that sends a tick every 1000 ms while something grows.">
