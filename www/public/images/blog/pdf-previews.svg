<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576" role="img" aria-label="One invoice template and its data are laid out once into a LaidOutDoc. Two backends read it: the PDF backend emits invoice.pdf for pdf_render and pdf_response, and the raster backend paints page images for pdf_preview and pdf_preview_response. Measured on the invoice sample at 150 dpi, page 1 is 165 KB as PNG, 51 KB as WebP at quality 90; a 320 pixel thumbnail is 25 KB as PNG and 7.7 KB as WebP.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="48" y="58" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e5e7eb">One layout, two backends</text>
  <text x="48" y="86" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#8b929e">The preview is painted from the same laid-out page the PDF is written from.</text>

  <!-- Inputs -->
  <rect x="48" y="130" width="196" height="150" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="66" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#f59e0b">invoice.template.json</text>
  <text x="66" y="186" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">"${customer.name}"</text>
  <text x="66" y="208" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">"${totals.due}"</text>
  <line x1="66" y1="226" x2="226" y2="226" stroke="#2b3038"/>
  <text x="66" y="252" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#f59e0b">+ data JSON</text>
  <text x="66" y="272" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#8b929e">{ "data": { ... } }</text>

  <line x1="246" y1="205" x2="300" y2="205" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layout -->
  <rect x="304" y="150" width="190" height="110" rx="14" fill="#101319" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="399" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb">layout engine</text>
  <text x="399" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#f59e0b">LaidOutDoc</text>
  <text x="399" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b929e">same font metrics</text>

  <path d="M496,190 C530,190 530,150 566,150" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M496,222 C530,222 530,290 566,290" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PDF backend -->
  <rect x="570" y="112" width="406" height="80" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="590" y="142" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#e5e7eb">pdf_backend.rs</text>
  <text x="590" y="168" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">pdf_render / pdf_response</text>
  <rect x="880" y="130" width="76" height="44" rx="8" fill="#0d0f12" stroke="#22c55e"/>
  <text x="918" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#22c55e">.pdf</text>

  <!-- Raster backend -->
  <rect x="570" y="222" width="406" height="120" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="590" y="252" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#e5e7eb">raster_backend.rs</text>
  <text x="590" y="278" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">pdf_preview / pdf_preview_response</text>
  <text x="590" y="302" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">pdf_preview_from_markdown</text>
  <text x="590" y="326" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#8b929e">dpi · width/height · pages · format · quality</text>
  <rect x="880" y="240" width="76" height="30" rx="8" fill="#0d0f12" stroke="#22c55e"/>
  <text x="918" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#22c55e">.png</text>
  <rect x="880" y="276" width="76" height="30" rx="8" fill="#0d0f12" stroke="#22c55e"/>
  <text x="918" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#22c55e">.webp</text>
  <rect x="880" y="312" width="76" height="24" rx="8" fill="#0d0f12" stroke="#22c55e"/>
  <text x="918" y="329" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#22c55e">.jpg</text>

  <!-- Sizes -->
  <rect x="48" y="378" width="928" height="160" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="68" y="408" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e5e7eb">invoice sample, page 1</text>
  <text x="956" y="408" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b929e">bar length = bytes</text>

  <text x="68" y="440" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">150 dpi PNG</text>
  <rect x="250" y="428" width="594" height="16" rx="4" fill="#8b929e" opacity="0.55"/>
  <text x="856" y="441" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#e5e7eb">165 KB</text>

  <text x="68" y="466" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#f59e0b">150 dpi WebP q90</text>
  <rect x="250" y="454" width="184" height="16" rx="4" fill="#f59e0b"/>
  <text x="446" y="467" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#e5e7eb">51 KB</text>

  <text x="68" y="492" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b929e">320 px PNG</text>
  <rect x="250" y="480" width="90" height="16" rx="4" fill="#8b929e" opacity="0.55"/>
  <text x="352" y="493" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#e5e7eb">25 KB</text>

  <text x="68" y="518" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#f59e0b">320 px WebP q90</text>
  <rect x="250" y="506" width="28" height="16" rx="4" fill="#f59e0b"/>
  <text x="290" y="519" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#e5e7eb">7.7 KB</text>
</svg>
