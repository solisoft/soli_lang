<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A request reaches a Cloudflare Worker. Inside it, worker.js hands the request to the Soli interpreter compiled to WebAssembly, which runs the app's routes, controllers, views and models. A model query suspends the wasm stack and goes to Cloudflare D1 or to SoliDB over HTTPS, then resumes. Built with soli edge build and shipped with npx wrangler deploy.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="512" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb">Soli on Cloudflare Workers, with D1</text>
  <text x="512" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b929e">the same app <tspan font-family="ui-monospace, monospace" fill="#f59e0b">soli serve</tspan> runs, next to the visitor, with no server</text>

  <!-- request -->
  <rect x="40" y="226" width="150" height="96" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="115" y="264" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">Request</text>
  <text x="115" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">GET /</text>
  <text x="115" y="308" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#8b929e">cf-colo: MRS</text>
  <line x1="192" y1="274" x2="262" y2="274" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- worker -->
  <rect x="268" y="124" width="440" height="356" rx="18" fill="none" stroke="url(#amber)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="288" y="152" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f59e0b">Cloudflare Worker · one isolate</text>

  <rect x="292" y="170" width="392" height="62" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="312" y="197" font-family="ui-monospace, monospace" font-size="16" fill="#e5e7eb">worker.js</text>
  <text x="312" y="219" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b929e">boots the app, queues requests into wasm</text>

  <rect x="292" y="246" width="392" height="62" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="312" y="273" font-family="ui-monospace, monospace" font-size="16" fill="#e5e7eb">soli_edge.wasm</text>
  <text x="312" y="295" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b929e">the Soli interpreter · 9 MB, 3 MB compressed</text>

  <rect x="292" y="322" width="392" height="134" rx="14" fill="#101319" stroke="#f59e0b" stroke-opacity="0.55"/>
  <text x="312" y="350" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb">your app, unchanged</text>
  <text x="312" y="376" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">routes · middleware · controllers</text>
  <text x="312" y="398" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">views · layouts · components</text>
  <text x="312" y="420" font-family="ui-monospace, monospace" font-size="13" fill="#f59e0b">Note.where(…).all</text>
  <text x="312" y="442" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b929e">the query suspends the wasm stack (JSPI)</text>

  <!-- databases -->
  <path d="M684 404 C740 404, 752 250, 806 250" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M684 420 C752 420, 752 400, 806 400" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M806 282 C760 282, 744 452, 690 448" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="770" y="474" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#22c55e">rows → resume</text>

  <rect x="808" y="200" width="180" height="100" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="898" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">D1</text>
  <text x="898" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b929e">SQLite, by Cloudflare</text>
  <text x="898" y="282" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">SOLI_DB_ADAPTER=d1</text>

  <rect x="808" y="356" width="180" height="88" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="898" y="392" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">SoliDB</text>
  <text x="898" y="416" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b929e">over HTTPS, with fetch</text>

  <!-- commands -->
  <rect x="212" y="500" width="600" height="40" rx="10" fill="#101319" stroke="#2b3038"/>
  <text x="512" y="526" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#e5e7eb"><tspan fill="#f59e0b">soli edge build .</tspan>  →  <tspan fill="#f59e0b">npx wrangler deploy</tspan></text>
</svg>
