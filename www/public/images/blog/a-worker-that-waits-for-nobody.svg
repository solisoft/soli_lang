<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Two timelines of one worker. Before: requests A, B and C run one after another, and each spends most of its time waiting on an API, so the worker sits idle. With SOLI_COROUTINES=1: the worker runs A, B and C in turn while their API calls are in flight, and each resumes when its answer arrives. Below, measured on 2 workers: an API at 500 ms goes from 4 to 74 requests per second, SoliDB writes from 1,180 to 3,120, an API call between two queries from 8 to 249.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <pattern id="wait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#1a1d23"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2b3038" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="512" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb">A worker that waits for nobody</text>
  <text x="512" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8b929e">the same worker, the same three requests, each calling an API</text>

  <!-- Before -->
  <rect x="48" y="118" width="928" height="150" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="72" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb">One request at a time</text>
  <text x="952" y="148" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">worker idle while it waits</text>
  <text x="72" y="196" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">worker</text>
  <!-- A -->
  <rect x="140" y="178" width="22" height="28" rx="4" fill="#f59e0b"/>
  <rect x="162" y="178" width="190" height="28" fill="url(#wait)"/>
  <rect x="352" y="178" width="18" height="28" rx="4" fill="#f59e0b"/>
  <!-- B -->
  <rect x="374" y="178" width="22" height="28" rx="4" fill="#38bdf8"/>
  <rect x="396" y="178" width="190" height="28" fill="url(#wait)"/>
  <rect x="586" y="178" width="18" height="28" rx="4" fill="#38bdf8"/>
  <!-- C -->
  <rect x="608" y="178" width="22" height="28" rx="4" fill="#a78bfa"/>
  <rect x="630" y="178" width="190" height="28" fill="url(#wait)"/>
  <rect x="820" y="178" width="18" height="28" rx="4" fill="#a78bfa"/>
  <text x="257" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">A waits 500 ms</text>
  <text x="491" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">B waits 500 ms</text>
  <text x="725" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">C waits 500 ms</text>
  <text x="952" y="198" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" fill="#ef4444">1.5 s</text>

  <!-- After -->
  <rect x="48" y="284" width="928" height="162" rx="14" fill="#101319" stroke="#d97706"/>
  <text x="72" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb">SOLI_COROUTINES=1</text>
  <text x="952" y="314" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">the wait happens off the worker</text>
  <text x="72" y="356" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">worker</text>
  <rect x="140" y="338" width="22" height="28" rx="4" fill="#f59e0b"/>
  <rect x="164" y="338" width="22" height="28" rx="4" fill="#38bdf8"/>
  <rect x="188" y="338" width="22" height="28" rx="4" fill="#a78bfa"/>
  <rect x="352" y="338" width="18" height="28" rx="4" fill="#f59e0b"/>
  <rect x="372" y="338" width="18" height="28" rx="4" fill="#38bdf8"/>
  <rect x="392" y="338" width="18" height="28" rx="4" fill="#a78bfa"/>
  <text x="72" y="404" font-family="ui-monospace, monospace" font-size="14" fill="#8b929e">network</text>
  <rect x="162" y="386" width="190" height="10" rx="3" fill="#f59e0b" opacity="0.45"/>
  <rect x="186" y="400" width="186" height="10" rx="3" fill="#38bdf8" opacity="0.45"/>
  <rect x="210" y="414" width="182" height="10" rx="3" fill="#a78bfa" opacity="0.45"/>
  <text x="430" y="358" font-family="ui-monospace, monospace" font-size="15" fill="#22c55e">0.5 s, free for other requests meanwhile</text>
  <text x="430" y="410" font-family="ui-monospace, monospace" font-size="13" fill="#8b929e">a waker puts each request back on its worker</text>

  <!-- Numbers -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="462" width="296" height="72" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="196" y="492" text-anchor="middle" font-size="14" fill="#8b929e">API at 500 ms</text>
    <text x="196" y="520" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">4 → <tspan fill="#f59e0b" font-weight="700">74</tspan> req/s</text>
    <rect x="364" y="462" width="296" height="72" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="512" y="492" text-anchor="middle" font-size="14" fill="#8b929e">SoliDB create + count + read</text>
    <text x="512" y="520" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">1,180 → <tspan fill="#f59e0b" font-weight="700">3,120</tspan></text>
    <rect x="680" y="462" width="296" height="72" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="828" y="492" text-anchor="middle" font-size="14" fill="#8b929e">API between two queries</text>
    <text x="828" y="520" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">8 → <tspan fill="#f59e0b" font-weight="700">249</tspan> req/s</text>
  </g>
</svg>
