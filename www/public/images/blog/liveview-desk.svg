<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="A Field Desk LiveView: parent socket with search and tabs, nested composer and focus components sharing assigns, file upload over HTTP, and an isolated pulse child socket.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="576" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1023" height="575" fill="none" stroke="#1c1f26"/>

  <text x="56" y="64" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="32" font-weight="700" fill="#f4f4f5">A live desk, one socket</text>
  <text x="56" y="94" font-family="system-ui, sans-serif" font-size="16" fill="#8b929e">Nested assigns, HTTP uploads, in-socket tabs, and a child pulse that the parent cannot wipe.</text>

  <g>
    <rect x="56" y="128" width="560" height="392" rx="14" fill="#101319" stroke="#2b3038"/>
    <rect x="56" y="128" width="560" height="42" rx="14" fill="#161a22"/>
    <rect x="56" y="156" width="560" height="14" fill="#161a22"/>
    <circle cx="78" cy="149" r="5" fill="#ef4444"/>
    <circle cx="96" cy="149" r="5" fill="#f59e0b"/>
    <circle cx="114" cy="149" r="5" fill="#22c55e"/>
    <text x="140" y="154" font-family="ui-monospace, monospace" font-size="12" fill="#6b7280">/live/socket/desk</text>

    <rect x="76" y="186" width="250" height="28" rx="8" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="88" y="204" font-family="ui-monospace, monospace" font-size="11" fill="#6b7280">search  soli-debounce</text>
    <rect x="336" y="186" width="64" height="28" rx="8" fill="#1c1917" stroke="#f59e0b"/>
    <text x="350" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Open</text>
    <rect x="406" y="186" width="64" height="28" rx="8" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="418" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#8b929e">Doing</text>
    <rect x="476" y="186" width="58" height="28" rx="8" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="490" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#8b929e">Done</text>

    <rect x="76" y="230" width="320" height="64" rx="10" fill="#16130f" stroke="#3a2a12"/>
    <text x="90" y="254" font-family="system-ui, sans-serif" font-size="13" fill="#e5e7eb">Inspect north hatch</text>
    <text x="90" y="276" font-family="ui-monospace, monospace" font-size="11" fill="#f59e0b">open · pinned · live_component</text>

    <rect x="76" y="304" width="320" height="64" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="90" y="328" font-family="system-ui, sans-serif" font-size="13" fill="#e5e7eb">Swap radio battery</text>
    <text x="90" y="350" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">doing</text>

    <rect x="412" y="230" width="180" height="138" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="426" y="254" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">Attach photo</text>
    <text x="426" y="276" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">POST /live/upload</text>
    <rect x="426" y="294" width="152" height="8" rx="4" fill="#1f242c"/>
    <rect x="426" y="294" width="96" height="8" rx="4" fill="#f59e0b"/>
    <text x="426" y="328" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">Job.retry · processed</text>

    <rect x="76" y="386" width="516" height="110" rx="10" fill="#0b0d0f" stroke="#2b3038"/>
    <text x="90" y="412" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">live_component("desk_composer")</text>
    <text x="90" y="436" font-family="system-ui, sans-serif" font-size="13" fill="#d1d5db">New note · soli-assign-* merges onto the parent</text>
    <text x="90" y="462" font-family="system-ui, sans-serif" font-size="13" fill="#8b929e">click-away closes the sheet · disable-with while filing</text>
  </g>

  <g>
    <rect x="648" y="128" width="320" height="176" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="668" y="158" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">/live/socket/desk_pulse</text>
    <text x="668" y="184" font-family="system-ui, sans-serif" font-size="14" fill="#e5e7eb">Isolated child socket</text>
    <text x="668" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#8b929e">implicit soli-ignore island</text>
    <g transform="translate(668, 236)">
      <rect x="0" y="16" width="6" height="14" rx="1" fill="#f59e0b"/>
      <rect x="10" y="10" width="6" height="20" rx="1" fill="#f59e0b"/>
      <rect x="20" y="6" width="6" height="24" rx="1" fill="#fbbf24"/>
      <rect x="30" y="12" width="6" height="18" rx="1" fill="#f59e0b"/>
      <rect x="40" y="4" width="6" height="26" rx="1" fill="#f59e0b"/>
      <rect x="50" y="8" width="6" height="22" rx="1" fill="#fbbf24"/>
      <rect x="60" y="14" width="6" height="16" rx="1" fill="#f59e0b"/>
      <rect x="70" y="2" width="6" height="28" rx="1" fill="#f59e0b"/>
    </g>
    <text x="668" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">soli-hook="Spark"</text>
  </g>

  <g>
    <rect x="648" y="324" width="320" height="196" rx="14" fill="#101319" stroke="#2b3038"/>
    <text x="668" y="354" font-family="system-ui, sans-serif" font-size="14" fill="#e5e7eb">Hash .where, same IR</text>
    <text x="668" y="384" font-family="ui-monospace, monospace" font-size="12" fill="#d1d5db">status: ["open","doing"]</text>
    <text x="668" y="406" font-family="ui-monospace, monospace" font-size="12" fill="#d1d5db">priority: { gte: 2 }</text>
    <text x="668" y="428" font-family="ui-monospace, monospace" font-size="12" fill="#d1d5db">title: { ilike: "%hatch%" }</text>
    <text x="668" y="460" font-family="system-ui, sans-serif" font-size="13" fill="#8b929e">SoliDB · SQLite · Postgres · MySQL</text>
    <text x="668" y="488" font-family="ui-monospace, monospace" font-size="11" fill="#f59e0b">db:schema:dump  ·  soli jobs</text>
  </g>
</svg>
